<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线编程 - WinOJ</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/js/tailwind.js"></script>
  <script>tailwind.config={darkMode:'class'}</script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script src="/js/api.js"></script>
  <style>
    #editorContainer { width: 100%; height: 500px; border-radius: 0.75rem; border: 1px solid #e5e7eb; position: relative; }
    .dark #editorContainer { border-color: #374151; }
    .dark select option { background-color: #1f2937; color: #f9fafb; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div id="nav"></div>
  <div class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-6">在线编程</h1>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-6">
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center space-x-3">
            <label class="text-sm font-medium text-gray-700 dark:text-gray-300">语言:</label>
            <select id="language" class="px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none dark:text-white" onchange="changeLang()">
            </select>
          </div>
          <button onclick="runCode()" id="runBtn" class="px-6 py-2 bg-green-600 text-white rounded-xl font-semibold hover:bg-green-700 transition flex items-center space-x-2">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <span>运行</span>
          </button>
        </div>
        <div id="editorContainer"></div>
        <div class="mt-4">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">标准输入 (stdin)</label>
          <textarea id="stdinInput" rows="6" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl font-mono text-sm text-left focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none dark:bg-gray-800 dark:text-white" placeholder="在此输入测试数据..."></textarea>
        </div>
      </div>
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-6">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-300">输出</h3>
          <div id="runInfo" class="text-sm text-gray-500 dark:text-gray-400 hidden">
            <span id="exitCode"></span>
            <span id="timeInfo" class="ml-3"></span>
            <span id="memInfo" class="ml-3"></span>
          </div>
        </div>
        <div id="output" class="bg-gray-900 text-green-400 p-4 rounded-xl font-mono text-sm min-h-[430px] overflow-auto whitespace-pre-wrap">点击 "运行" 执行代码...</div>
      </div>
    </div>
  </div>
  <script>
    requireAuth();
    document.getElementById('nav').innerHTML = renderNav('ide');
    let editor;
    const langMap = { c: 'c', cpp: 'cpp', python3: 'python', java: 'java', javascript: 'javascript' };
    async function init() {
      require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' } });
      require(['vs/editor/editor.main'], function () {
        const lang = document.getElementById('language').value;
        editor = monaco.editor.create(document.getElementById('editorContainer'), {
          value: '',
          language: langMap[lang] || 'plaintext',
          fontSize: 14,
          minimap: { enabled: false },
          scrollBeyondLastLine: false,
          automaticLayout: true,
          tabSize: 4,
          theme: document.documentElement.classList.contains('dark') ? 'vs-dark' : 'vs'
        });
        editor.focus();
      });
      try {
        const langs = await apiCall('GET', '/ide/languages');
        const sel = document.getElementById('language');
        sel.innerHTML = langs.map(l => `<option value="${l.name}">${l.display_name}</option>`).join('');
        const user = getUser();
        if (user && user.preferred_language) {
          sel.value = user.preferred_language;
          changeLang();
        }
      } catch {}
    }
    function changeLang() {
      const lang = document.getElementById('language').value;
      if (editor) monaco.editor.setModelLanguage(editor.getModel(), langMap[lang] || 'plaintext');
    }
    async function runCode() {
      const btn = document.getElementById('runBtn');
      const output = document.getElementById('output');
      btn.disabled = true; btn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg><span>审查中...</span>';
      output.className = 'bg-gray-900 text-gray-400 p-4 rounded-xl font-mono text-sm min-h-[430px] overflow-auto whitespace-pre-wrap';
      output.textContent = '代码安全审查中...';
      document.getElementById('runInfo').classList.add('hidden');
      const language = document.getElementById('language').value;
      const source_code = editor.getValue();
      const stdin = document.getElementById('stdinInput').value;
      try {
        const reviewRes = await apiCall('POST', '/ide/review', { language, source_code });
        if (!reviewRes.safe) {
          output.textContent = `安全审查未通过: ${reviewRes.reason}`;
          output.className = 'bg-gray-900 text-red-400 p-4 rounded-xl font-mono text-sm min-h-[430px] overflow-auto whitespace-pre-wrap';
          btn.disabled = false; btn.innerHTML = '<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>运行</span>';
          return;
        }
        const createRes = await apiCall('POST', '/ide/run', { language, source_code, stdin });
        const runId = createRes.run_id;
        btn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg><span>编译中...</span>';
        output.textContent = '编译中...';
        const statusTexts = { pending: '等待中...', pending_review: '审查中...', compiling: '编译中...', running: '运行中...' };
        let attempts = 0;
        while (attempts < 100) {
          await new Promise(r => setTimeout(r, 500));
          const data = await apiCall('GET', `/ide/run/${runId}`);
          if (data.status !== 'pending' && data.status !== 'pending_review' && data.status !== 'compiling' && data.status !== 'running') {
            let out = '';
            if (data.status === 'compile_error') {
              out = `编译错误:\n${data.compile_output || data.stderr}`;
              output.className = 'bg-gray-900 text-red-400 p-4 rounded-xl font-mono text-sm min-h-[430px] overflow-auto whitespace-pre-wrap';
            } else if (data.status === 'accepted') {
              out = data.stdout || '程序执行成功（无输出）';
              if (data.stderr) out += (out ? '\n' : '') + `标准错误:\n${data.stderr}`;
              output.className = data.exit_code === 0 ? 'bg-gray-900 text-green-400 p-4 rounded-xl font-mono text-sm min-h-[430px] overflow-auto whitespace-pre-wrap' : 'bg-gray-900 text-yellow-400 p-4 rounded-xl font-mono text-sm min-h-[430px] overflow-auto whitespace-pre-wrap';
            } else {
              out = data.stderr || '运行出错';
              if (data.exit_code !== undefined && data.exit_code !== -1) out += `\n退出码: ${data.exit_code}`;
              output.className = 'bg-gray-900 text-red-400 p-4 rounded-xl font-mono text-sm min-h-[430px] overflow-auto whitespace-pre-wrap';
            }
            output.textContent = out;
            document.getElementById('runInfo').classList.remove('hidden');
            document.getElementById('exitCode').textContent = `退出码: ${data.exit_code}`;
            document.getElementById('timeInfo').textContent = `耗时: ${data.time_used}ms`;
            document.getElementById('memInfo').textContent = `内存: ${data.memory_used || 0}KB`;
            break;
          }
          const label = statusTexts[data.status] || data.status;
          btn.innerHTML = `<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg><span>${label}</span>`;
          output.textContent = label;
          attempts++;
        }
      } catch (err) {
        output.textContent = `错误: ${err.message || '运行失败'}`;
        output.className = 'bg-gray-900 text-red-400 p-4 rounded-xl font-mono text-sm min-h-[430px] overflow-auto whitespace-pre-wrap';
      }
      btn.disabled = false; btn.innerHTML = '<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>运行</span>';
    }
    init();
    new MutationObserver(() => {
      if (editor) monaco.editor.setTheme(document.documentElement.classList.contains('dark') ? 'vs-dark' : 'vs');
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
  </script>
</body>
</html>
