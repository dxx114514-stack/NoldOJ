<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>题目 - WinOJ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/markdown.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div id="nav"></div>
  <div class="max-w-4xl mx-auto px-4 py-8">
    <div id="content" class="text-center py-12 text-gray-400 dark:text-gray-500 dark:text-gray-400">加载中...</div>
  </div>
  <script>
    document.getElementById('nav').innerHTML = renderNav('problems');
    const params = new URLSearchParams(window.location.search);
    const pid = params.get('id');
    async function loadProblem() {
      if (!pid) { document.getElementById('content').innerHTML = '<p class="text-red-500">未指定题目 ID</p>'; return; }
      try {
        const p = await apiCall('GET', `/problems/${pid}`);
        document.title = `${p.title} - WinOJ`;
        let tagsHtml = '';
        let categoriesHtml = '';
        try {
          const tags = await apiCall('GET', `/tags/problem/${p.id}`);
          if (tags.length > 0) {
            tagsHtml = tags.map(t => `<span class="px-3 py-1 text-xs rounded-full" style="background-color: ${t.color}20; color: ${t.color}">${escapeHtml(t.name)}</span>`).join('');
          }
        } catch {}
        if (p.categories && p.categories.length > 0) {
          categoriesHtml = p.categories.map(c => `<span class="px-3 py-1 text-xs rounded-full bg-amber-50 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400">${escapeHtml(c.name)}</span>`).join('');
        }

        document.getElementById('content').innerHTML = `
          <div class="bg-white dark:bg-gray-800 dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-8">
            <div class="flex items-start justify-between mb-6">
              <div>
                <h1 class="text-3xl font-bold text-gray-900 dark:text-white">${escapeHtml(p.title)}</h1>
                <div class="flex flex-wrap gap-2 mt-3">
                  ${categoriesHtml}
                  ${tagsHtml}
                  <span class="px-3 py-1 text-xs rounded-full bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300">${p.problem_type === 'traditional' ? '传统题' : p.problem_type === 'interactive' ? '交互题' : p.problem_type === 'submit_answer' ? '提交答案' : p.problem_type}</span>
                  <span class="px-3 py-1 text-xs rounded-full bg-gray-100 text-gray-600 dark:text-gray-400 dark:text-gray-500">时限: ${p.time_limit}ms</span>
                  <span class="px-3 py-1 text-xs rounded-full bg-gray-100 text-gray-600 dark:text-gray-400 dark:text-gray-500">内存: ${p.memory_limit}MB</span>
                  ${p.provider ? `<span class="px-3 py-1 text-xs rounded-full bg-purple-50 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300">提供者: ${escapeHtml(p.provider)}</span>` : ''}
                </div>
              </div>
              <a href="/pages/submit.html?id=${p.id}" class="px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition whitespace-nowrap">提交</a>
            </div>
            <div class="mb-6">
              <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">题目描述</h3>
              ${renderMarkdown(p.description)}
            </div>
            ${p.input_desc ? `<div class="mb-6"><h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">输入格式</h3>${renderMarkdown(p.input_desc)}</div>` : ''}
            ${p.output_desc ? `<div class="mb-6"><h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">输出格式</h3>${renderMarkdown(p.output_desc)}</div>` : ''}
            ${(p.sample_input || p.sample_output) ? `
            <div class="mb-6">
              <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-3">输入输出样例</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${p.sample_input ? `<div>
                  <div class="flex items-center justify-between mb-1">
                    <span class="text-sm font-medium text-gray-700 dark:text-gray-300">输入</span>
                    <button onclick="copySample(this, 'sample-input-${p.id}')" class="text-xs text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300">复制</button>
                  </div>
                  <pre id="sample-input-${p.id}" class="bg-gray-100 dark:bg-gray-700 rounded-xl p-4 text-sm font-mono text-gray-800 dark:text-gray-200 overflow-x-auto whitespace-pre-wrap">${escapeHtml(p.sample_input)}</pre>
                </div>` : ''}
                ${p.sample_output ? `<div>
                  <div class="flex items-center justify-between mb-1">
                    <span class="text-sm font-medium text-gray-700 dark:text-gray-300">输出</span>
                    <button onclick="copySample(this, 'sample-output-${p.id}')" class="text-xs text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300">复制</button>
                  </div>
                  <pre id="sample-output-${p.id}" class="bg-gray-100 dark:bg-gray-700 rounded-xl p-4 text-sm font-mono text-gray-800 dark:text-gray-200 overflow-x-auto whitespace-pre-wrap">${escapeHtml(p.sample_output)}</pre>
                </div>` : ''}
              </div>
            </div>
            ` : ''}
            ${p.hint ? `<div class="mb-6"><h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">提示</h3>${renderMarkdown(p.hint)}</div>` : ''}
            <div class="mt-6 pt-6 border-t border-gray-200 dark:border-gray-700 text-sm text-gray-500 dark:text-gray-400 dark:text-gray-500">
              测试点: ${p.test_cases_count || 0}
            </div>
          </div>
          <div id="solutions"></div>
        `;

        try {
          const sols = await apiCall('GET', `/problems/${pid}/solutions`);
          if (sols.length > 0) {
            const solHtml = sols.map(s => `
              <div class="bg-white dark:bg-gray-800 dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-6 mt-4">
                <div class="flex items-center justify-between mb-3">
                  <h3 class="text-lg font-semibold text-gray-900 dark:text-white">📝 题解: ${escapeHtml(s.article_title || '未命名')}</h3>
                  <a href="/pages/article.html?id=${s.article_id}" class="text-indigo-600 dark:text-indigo-400 text-sm hover:underline">查看完整文章</a>
                </div>
                <div id="sol-${s.id}">${renderMarkdown((s.article_content || '').slice(0, 500))}${(s.article_content || '').length > 500 ? '...' : ''}</div>
              </div>
            `).join('');
            document.getElementById('solutions').innerHTML = solHtml;
            sols.forEach(s => renderMathInElement(document.getElementById(`sol-${s.id}`)));
          }
        } catch {}
        renderMathInElement(document.getElementById('content'));
      } catch (err) {
        document.getElementById('content').innerHTML = `<p class="text-red-500 text-center">${err.message || '加载题目失败'}</p>`;
      }
    }
    loadProblem();
    function copySample(btn, preId) {
      const text = document.getElementById(preId).textContent;
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = '已复制';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    }
  </script>
</body>
</html>
