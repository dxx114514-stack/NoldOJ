<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>题目 - NoldOJ</title>
  <script src="/js/tailwind.js"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>
  <script src="/js/api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js" integrity="sha384-ZuC+DIACqSIZTsp+7YF57cR5Y+6qXa7YFbEKdA/EHA/R0T+41dtorqucYl71Zp+t" crossorigin="anonymous"></script>
  <script src="/js/markdown.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div id="nav"></div>
  <div class="max-w-4xl mx-auto px-4 py-8">
    <div id="content" class="text-center py-12 text-gray-400 dark:text-gray-500 dark:text-gray-400">加载中...</div>
  </div>
  <script>
    document.getElementById('nav').innerHTML = renderNav('problems');
    const params = new URLSearchParams(window.location.search);
    const pid = params.get('id');
    let currentProblem = null;
    async function loadProblem() {
      if (!pid) { document.getElementById('content').innerHTML = '<p class="text-red-500">未指定题目 ID</p>'; return; }
      try {
        const p = await apiCall('GET', `/problems/${pid}`);
        currentProblem = p;
        document.title = `${p.title} - NoldOJ`;
        let tagsHtml = '';
        let categoriesHtml = '';
        try {
          const tags = await apiCall('GET', `/tags/problem/${p.id}`);
          if (tags.length > 0) {
            tagsHtml = tags.map(t => `<span class="px-3 py-1 text-xs rounded-full" style="background-color: ${escapeHtml(t.color)}20; color: ${escapeHtml(t.color)}">${escapeHtml(t.name)}</span>`).join('');
          }
        } catch {}
        if (p.categories && p.categories.length > 0) {
          categoriesHtml = p.categories.map(c => `<span class="px-3 py-1 text-xs rounded-full bg-amber-50 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400">${escapeHtml(c.name)}</span>`).join('');
        }

        document.getElementById('content').innerHTML = `
          <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-8">
            <div class="flex items-start justify-between mb-6">
              <div>
                <h1 class="text-3xl font-bold text-gray-900 dark:text-white">${escapeHtml(p.title)}</h1>
                <div class="flex flex-wrap gap-2 mt-3">
                  ${categoriesHtml}
                  ${tagsHtml}
                  <span class="px-3 py-1 text-xs rounded-full bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300">${p.problem_type === 'traditional' ? '传统题' : p.problem_type === 'interactive' ? '交互题' : p.problem_type === 'submit_answer' ? '提交答案' : p.problem_type}</span>
                  <span class="px-3 py-1 text-xs rounded-full bg-gray-100 text-gray-600 dark:text-gray-400 dark:text-gray-500">时限: ${p.time_limit}ms</span>
                  <span class="px-3 py-1 text-xs rounded-full bg-gray-100 text-gray-600 dark:text-gray-400 dark:text-gray-500">内存: ${p.memory_limit}MB</span>
                  ${p.provider ? `<span class="px-3 py-1 text-xs rounded-full bg-purple-50 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300">提供者: ${escapeHtml(p.provider)}</span>` : ''}
                </div>
              </div>
              <div class="flex items-center space-x-2">
                <button id="favBtn" onclick="toggleFavorite(this)" class="px-4 py-2 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-xl text-sm font-medium hover:bg-gray-200 dark:hover:bg-gray-600 transition" title="收藏本题">
                  ☆ 收藏
                </button>
                <button onclick="copyProblemMarkdown(this)" class="px-4 py-2 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-xl text-sm font-medium hover:bg-gray-200 dark:hover:bg-gray-600 transition" title="复制为 Markdown">
                  📋 复制 Markdown
                </button>
                <button id="hintBtn" onclick="getAiHint(this)" class="px-4 py-2 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-xl text-sm font-medium hover:bg-gray-200 dark:hover:bg-gray-600 transition hidden" title="失败 2 次后可获取 AI 思路提示">
                  💡 AI 思路提示
                </button>
                <a href="/pages/submit.html?id=${p.id}" class="px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition whitespace-nowrap">提交</a>
              </div>
            </div>
            <div class="mb-6">
              <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">题目描述</h3>
              ${renderMarkdown(p.description)}
            </div>
            ${p.input_desc ? `<div class="mb-6"><h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">输入格式</h3>${renderMarkdown(p.input_desc)}</div>` : ''}
            ${p.output_desc ? `<div class="mb-6"><h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">输出格式</h3>${renderMarkdown(p.output_desc)}</div>` : ''}
            ${(function(){
              const samples = Array.isArray(p.samples) && p.samples.length > 0
                ? p.samples
                : ((p.sample_input || p.sample_output) ? [{ input: p.sample_input || '', output: p.sample_output || '', note: '' }] : []);
              if (samples.length === 0) return '';
              return `
            <div class="mb-6">
              <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-3">输入输出样例${samples.length > 1 ? `<span class="text-sm font-normal text-gray-500 dark:text-gray-400 ml-2">共 ${samples.length} 组</span>` : ''}</h3>
              ${samples.map((s, idx) => {
                const sid = 'sample-' + p.id + '-' + idx;
                const multi = samples.length > 1;
                return `
                <div class="${multi ? 'mb-5 pb-5 border-b border-gray-100 dark:border-gray-700 last:border-0 last:mb-0 last:pb-0' : ''}">
                  ${multi || s.note ? `<div class="text-sm font-medium text-gray-800 dark:text-gray-200 mb-2">${multi ? `样例 #${idx + 1}` : '样例'}${s.note ? `<span class="font-normal text-gray-500 dark:text-gray-400 ml-2">${escapeHtml(s.note)}</span>` : ''}</div>` : ''}
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    ${s.input ? `<div>
                      <div class="flex items-center justify-between mb-1">
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-300">输入</span>
                        <button onclick="copySample(this, '${sid}-in')" class="text-xs text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300">复制</button>
                      </div>
                      <pre id="${sid}-in" class="bg-gray-100 dark:bg-gray-700 rounded-xl p-4 text-sm font-mono text-gray-800 dark:text-gray-200 overflow-x-auto whitespace-pre-wrap">${escapeHtml(s.input)}</pre>
                    </div>` : ''}
                    ${s.output ? `<div>
                      <div class="flex items-center justify-between mb-1">
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-300">输出</span>
                        <button onclick="copySample(this, '${sid}-out')" class="text-xs text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300">复制</button>
                      </div>
                      <pre id="${sid}-out" class="bg-gray-100 dark:bg-gray-700 rounded-xl p-4 text-sm font-mono text-gray-800 dark:text-gray-200 overflow-x-auto whitespace-pre-wrap">${escapeHtml(s.output)}</pre>
                    </div>` : ''}
                  </div>
                </div>`;
              }).join('')}
            </div>`;
            })()}
            ${p.hint ? `<div class="mb-6"><h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">提示</h3>${renderMarkdown(p.hint)}</div>` : ''}
            <div class="mt-6 pt-6 border-t border-gray-200 dark:border-gray-700 text-sm text-gray-500 dark:text-gray-400 dark:text-gray-500">
              测试点: ${p.test_cases_count || 0}
            </div>
          </div>
          <div id="solutions"></div>
          <div id="discussionsSection" class="mt-6">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-lg font-semibold text-gray-900 dark:text-white">💬 讨论</h3>
              <a href="/pages/discussion-edit.html?problem_id=${p.id}" class="px-3 py-1.5 bg-indigo-600 text-white text-sm rounded-lg hover:bg-indigo-700">+ 发帖</a>
            </div>
            <div id="discussionsList" class="space-y-3">加载中...</div>
            <div id="discussionsPager" class="mt-4 flex justify-center gap-2"></div>
          </div>
        `;

        try {
          const sols = await apiCall('GET', `/problems/${pid}/solutions`);
          if (sols.length > 0) {
            const solHtml = sols.map(s => `
              <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-6 mt-4">
                <div class="flex items-center justify-between mb-3">
                  <h3 class="text-lg font-semibold text-gray-900 dark:text-white">📝 题解: ${escapeHtml(s.article_title || '未命名')}</h3>
                  <a href="/pages/article.html?id=${s.article_id}" class="text-indigo-600 dark:text-indigo-400 text-sm hover:underline">查看完整文章</a>
                </div>
                <div id="sol-${s.id}">${renderMarkdown((s.article_content || '').slice(0, 500))}${(s.article_content || '').length > 500 ? '...' : ''}</div>
              </div>
            `).join('');
            document.getElementById('solutions').innerHTML = solHtml;
            sols.forEach(s => renderMathDefaults(document.getElementById(`sol-${s.id}`)));
          }
        } catch {}
        renderMathDefaults(document.getElementById('content'));
        // 加载讨论列表
        loadDiscussions(1);
      } catch (err) {
        document.getElementById('content').innerHTML = `<p class="text-red-500 text-center">${escapeHtml(err.message) || '加载题目失败'}</p>`;
      }
    }
    loadProblem();
    // 收藏按钮：初始化状态 + 切换
    let favorited = false;
    async function initFavorite() {
      if (!getToken()) return;
      const btn = document.getElementById('favBtn');
      if (!btn) return;
      try {
        const d = await apiCall('GET', `/favorites/status?ids=${pid}`);
        favorited = !!d.favorites[pid];
        btn.innerHTML = favorited ? '★ 已收藏' : '☆ 收藏';
        btn.classList.toggle('bg-yellow-100', favorited);
        btn.classList.toggle('text-yellow-700', favorited);
        btn.classList.toggle('dark:bg-yellow-900/30', favorited);
        btn.classList.toggle('dark:text-yellow-300', favorited);
      } catch {}
    }
    async function toggleFavorite(btn) {
      if (!getToken()) {
        window.location.href = '/pages/login.html';
        return;
      }
      try {
        if (favorited) {
          await apiCall('DELETE', `/favorites/${pid}`);
          favorited = false;
          btn.innerHTML = '☆ 收藏';
        } else {
          await apiCall('POST', `/favorites/${pid}`, {});
          favorited = true;
          btn.innerHTML = '★ 已收藏';
        }
        btn.classList.toggle('bg-yellow-100', favorited);
        btn.classList.toggle('text-yellow-700', favorited);
        btn.classList.toggle('dark:bg-yellow-900/30', favorited);
        btn.classList.toggle('dark:text-yellow-300', favorited);
      } catch (err) {
        alert(err.message || '操作失败');
      }
    }
    initFavorite();
    // AI 思路提示按钮：登录用户可见（后端按失败次数门槛控制）
    if (getToken()) {
      const hintBtn = document.getElementById('hintBtn');
      if (hintBtn) hintBtn.classList.remove('hidden');
    }
    async function getAiHint(btn) {
      if (!getToken()) {
        window.location.href = '/pages/login.html';
        return;
      }
      const orig = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '生成中...';
      try {
        const d = await apiCall('POST', `/problems/${pid}/hint`, {});
        btn.innerHTML = orig;
        btn.disabled = false;
        alert(`💡 AI 思路提示：\n\n${d.hint}`);
      } catch (err) {
        btn.innerHTML = orig;
        btn.disabled = false;
        alert(err.message || '获取提示失败');
      }
    }
    function copySample(btn, preId) {
      const text = document.getElementById(preId).textContent;
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = '已复制';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    }
    function copyProblemMarkdown(btn) {
      if (!currentProblem) return;
      const p = currentProblem;
      let md = `# ${p.title}\n\n`;
      if (p.description) md += p.description + '\n\n';
      if (p.input_desc) md += `## 输入格式\n\n${p.input_desc}\n\n`;
      if (p.output_desc) md += `## 输出格式\n\n${p.output_desc}\n\n`;
      const samples = Array.isArray(p.samples) && p.samples.length > 0
        ? p.samples
        : ((p.sample_input || p.sample_output) ? [{ input: p.sample_input || '', output: p.sample_output || '' }] : []);
      if (samples.length > 0) {
        md += '## 输入输出样例\n\n';
        samples.forEach((s, i) => {
          if (samples.length > 1) md += `### 样例 #${i + 1}${s.note ? '：' + s.note : ''}\n\n`;
          if (s.input) md += '**输入**\n```\n' + s.input + '\n```\n\n';
          if (s.output) md += '**输出**\n```\n' + s.output + '\n```\n\n';
        });
      }
      if (p.hint) md += `## 提示\n\n${p.hint}\n`;
      navigator.clipboard.writeText(md).then(() => {
        const orig = btn.textContent;
        btn.textContent = '✓ 已复制';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    }
    // 功能8：讨论列表加载
    let discussionPage = 1;
    async function loadDiscussions(page) {
      discussionPage = page;
      const listEl = document.getElementById('discussionsList');
      const pagerEl = document.getElementById('discussionsPager');
      if (!listEl) return;
      try {
        const data = await apiCall('GET', `/problems/${pid}/discussions?page=${page}&size=10`);
        if (!data.discussions || data.discussions.length === 0) {
          listEl.innerHTML = '<p class="text-gray-400 text-center py-4">暂无讨论，快来抢沙发！</p>';
          pagerEl.innerHTML = '';
          return;
        }
        listEl.innerHTML = data.discussions.map(d => `
          <a href="/pages/discussion.html?id=${d.id}" class="block bg-white dark:bg-gray-800 rounded-xl border ${d.is_official ? 'border-yellow-400 dark:border-yellow-600 shadow-sm' : 'border-gray-100 dark:border-gray-700'} p-4 hover:shadow-md transition">
            <div class="flex items-start justify-between">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap mb-1">
                  ${d.pinned ? '<span class="px-1.5 py-0.5 text-xs rounded bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300">置顶</span>' : ''}
                  ${d.is_official ? '<span class="px-1.5 py-0.5 text-xs rounded bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-300">官方</span>' : ''}
                  ${d.locked ? '<span class="px-1.5 py-0.5 text-xs rounded bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300">已锁定</span>' : ''}
                  <h4 class="font-semibold text-gray-900 dark:text-white truncate">${escapeHtml(d.title)}</h4>
                </div>
                <p class="text-xs text-gray-500 dark:text-gray-400 dark:text-gray-500">by ${escapeHtml(d.nickname || d.username)} · ${new Date(d.created_at).toLocaleString()}</p>
              </div>
              <span class="text-xs text-gray-400 ml-2 whitespace-nowrap">${d.reply_count} 回复</span>
            </div>
          </a>
        `).join('');
        const totalPages = Math.ceil(data.total / 10) || 1;
        let ph = '';
        for (let i = 1; i <= totalPages; i++) {
          ph += `<button onclick="loadDiscussions(${i})" class="px-3 py-1 text-sm rounded-lg ${i===page?'bg-indigo-600 text-white':'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700'}">${i}</button>`;
        }
        pagerEl.innerHTML = ph;
      } catch (err) {
        listEl.innerHTML = `<p class="text-red-500 text-center py-4">${escapeHtml(err.message) || '加载讨论失败'}</p>`;
      }
    }
  </script>
</body>
</html>
