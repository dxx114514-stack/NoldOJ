<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章 - WinOJ</title>
  <script src="/js/tailwind.js"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>
  <script src="/js/api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js" integrity="sha384-ZuC+DIACqSIZTsp+7YF57cR5Y+6qXa7YFbEKdA/EHA/R0T+41dtorqucYl71Zp+t" crossorigin="anonymous"></script>
  <script src="/js/markdown.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div id="nav"></div>
  <div class="max-w-4xl mx-auto px-4 py-8">
    <div id="content" class="text-center py-12 text-gray-400 dark:text-gray-500 dark:text-gray-400">加载中...</div>
  </div>
  <script>
    document.getElementById('nav').innerHTML = renderNav('');
    const params = new URLSearchParams(window.location.search);
    const aid = params.get('id');
    const user = getUser();
    let currentArticle = null;

    async function loadArticle() {
      if (!aid) { document.getElementById('content').innerHTML = '<p class="text-red-500">未指定文章 ID</p>'; return; }
      try {
        const a = await apiCall('GET', `/articles/${aid}`);
        currentArticle = a;
        document.title = `${a.title} - WinOJ`;
        const isAuthor = user && user.id === a.author_id;
        const canEdit = isAuthor || (user && ['admin', 'su'].includes(user.role));

        document.getElementById('content').innerHTML = `
          <div class="bg-white dark:bg-gray-800 dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-8">
            <div class="flex items-start justify-between mb-6">
              <div>
                <h1 class="text-3xl font-bold text-gray-900 dark:text-white">${escapeHtml(a.title)}</h1>
                <div class="flex items-center space-x-3 mt-2 text-sm text-gray-500 dark:text-gray-400 dark:text-gray-500">
                  <a href="profile.html?id=${a.author_id}" class="text-indigo-600 dark:text-indigo-400 hover:underline">${escapeHtml(a.nickname || a.username)}</a>
                  <span>·</span>
                  <span>${new Date(a.created_at).toLocaleString()}</span>
                  ${a.provider ? `<span class="px-2 py-0.5 text-xs rounded-full bg-purple-50 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300">提供者: ${escapeHtml(a.provider)}</span>` : ''}
                  ${a.is_published ? '' : '<span class="px-2 py-0.5 text-xs rounded-full bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-300">未发布</span>'}
                </div>
              </div>
              ${canEdit ? `
                <div class="flex space-x-2">
                  <button onclick="copyArticleMarkdown(this)" class="px-4 py-1.5 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 text-sm rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition" title="复制为 Markdown">📋 复制 Markdown</button>
                  <a href="/pages/article-edit.html?id=${a.id}" class="px-4 py-1.5 bg-indigo-100 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 text-sm rounded-lg hover:bg-indigo-200">编辑</a>
                  <button onclick="deleteArticle(${a.id})" class="px-4 py-1.5 bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300 text-sm rounded-lg hover:bg-red-200">删除</button>
                </div>
              ` : `
                <button onclick="copyArticleMarkdown(this)" class="px-4 py-1.5 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 text-sm rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition" title="复制为 Markdown">📋 复制 Markdown</button>
              `}
            </div>
            <div id="articleContent">${renderMarkdown(a.content)}</div>
          </div>
        `;
        if (window.renderMathInElement) { renderMathInElement(document.getElementById('articleContent')); }
      } catch (err) {
        document.getElementById('content').innerHTML = `<p class="text-red-500 text-center">${err.message || '加载失败'}</p>`;
      }
    }

    async function deleteArticle(id) {
      if (!confirm('确定删除此文章？')) return;
      try { await apiCall('DELETE', `/articles/${id}`); window.location.href = '/pages/articles.html'; } catch (err) { alert(err.message); }
    }

    function copyArticleMarkdown(btn) {
      if (!currentArticle) return;
      const a = currentArticle;
      let md = `# ${a.title}\n\n`;
      if (a.content) md += a.content + '\n';
      navigator.clipboard.writeText(md).then(() => {
        const orig = btn.textContent;
        btn.textContent = '✓ 已复制';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    }

    loadArticle();
  </script>
</body>
</html>
