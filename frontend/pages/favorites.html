<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的收藏 - WinOJ</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/js/tailwind.js"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <script src="/js/api.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div id="nav"></div>
  <div class="max-w-5xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-3xl font-bold text-gray-900 dark:text-white">⭐ 我的收藏</h1>
      <div id="countBadge" class="text-sm text-gray-500 dark:text-gray-400"></div>
    </div>
    <div id="list" class="bg-white dark:bg-gray-800 dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 divide-y divide-gray-100 dark:divide-gray-700"></div>
    <div id="pager" class="mt-6 flex justify-center gap-2"></div>
  </div>
  <script>
    document.getElementById('nav').innerHTML = renderNav('problems');
    const params = new URLSearchParams(window.location.search);
    let page = parseInt(params.get('page')) || 1;
    const DIFF = ['入门','简单','中等','较难','困难','极难'];

    if (!getToken()) window.location.href = '/pages/login.html';

    async function load() {
      try {
        const data = await apiCall('GET', `/favorites?page=${page}&size=20`);
        const list = document.getElementById('list');
        document.getElementById('countBadge').textContent = `共 ${data.total} 道收藏`;
        if (!data.favorites || data.favorites.length === 0) {
          list.innerHTML = '<div class="text-center text-gray-400 dark:text-gray-500 py-16">暂无收藏，去题库逛逛吧</div>';
          document.getElementById('pager').innerHTML = '';
          return;
        }
        list.innerHTML = data.favorites.map(f => `
          <div class="flex items-center justify-between px-6 py-4 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition">
            <a href="/pages/problem.html?id=${f.problem_id}" class="flex items-center space-x-4 min-w-0 flex-1">
              <span class="text-xl">${f.solved ? '✅' : '⬜'}</span>
              <div class="min-w-0">
                <div class="font-semibold text-gray-900 dark:text-white truncate">#${f.problem_id} ${escapeHtml(f.title)}</div>
                <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">
                  <span class="mr-3">难度: ${DIFF[f.difficulty] || f.difficulty}</span>
                  <span>收藏于 ${new Date(f.created_at).toLocaleDateString()}</span>
                </div>
              </div>
            </a>
            <button onclick="removeFav(${f.problem_id}, this)" class="flex-shrink-0 px-3 py-1.5 text-xs rounded-lg border border-gray-200 dark:border-gray-600 text-gray-500 dark:text-gray-400 hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-900/30 dark:hover:text-red-400 transition">取消收藏</button>
          </div>
        `).join('');

        const totalPages = Math.ceil(data.total / 20) || 1;
        const pager = document.getElementById('pager');
        let ph = '';
        for (let i = 1; i <= totalPages; i++) {
          ph += `<button onclick="gotoPage(${i})" class="px-3 py-1 text-sm rounded-lg ${i===page?'bg-indigo-600 text-white':'bg-white dark:bg-gray-800 dark:bg-gray-800 text-gray-600 dark:text-gray-300 dark:text-gray-500 border border-gray-200 dark:border-gray-700'}">${i}</button>`;
        }
        pager.innerHTML = ph;
      } catch (err) {
        document.getElementById('list').innerHTML = `<p class="text-center text-red-500 py-16">${escapeHtml(err.message) || '加载失败'}</p>`;
      }
    }

    async function removeFav(pid, btn) {
      try {
        await apiCall('DELETE', `/favorites/${pid}`);
        btn.closest('div').remove();
        load();
      } catch (err) {
        alert(err.message || '操作失败');
      }
    }

    function gotoPage(p) {
      page = p;
      window.history.replaceState({}, '', `?page=${p}`);
      load();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    load();
  </script>
</body>
</html>
