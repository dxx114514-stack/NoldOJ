<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>试卷库 - NoldOJ</title>
  <script src="/js/tailwind.js"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <script src="/js/api.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div id="nav"></div>
  <div class="max-w-5xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white">📝 试卷库</h1>
      <div id="createBtn"></div>
    </div>
    <div class="mb-4">
      <input id="searchInput" type="text" placeholder="搜索试卷..." class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none dark:bg-gray-800 dark:text-white" oninput="loadExams(1)">
    </div>
    <div id="list" class="space-y-3">加载中...</div>
    <div id="pager" class="mt-6 flex justify-center gap-2"></div>
  </div>
  <script>
    document.getElementById('nav').innerHTML = renderNav('exams');
    const user = getUser();
    if (user && ['teacher','admin','su'].includes(user.role)) {
      document.getElementById('createBtn').innerHTML = '<a href="/pages/exam-edit.html" class="px-4 py-2 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700">+ 创建试卷</a>';
    }

    let page = 1;
    async function loadExams(p) {
      page = p;
      const search = document.getElementById('searchInput').value;
      try {
        const data = await apiCall('GET', `/exams?page=${page}&limit=20&search=${encodeURIComponent(search)}`);
        if (!data.exams || data.exams.length === 0) {
          document.getElementById('list').innerHTML = '<p class="text-gray-400 text-center py-8">暂无试卷</p>';
          document.getElementById('pager').innerHTML = '';
          return;
        }
        document.getElementById('list').innerHTML = data.exams.map(e => `
          <a href="/pages/exam.html?id=${e.id}" class="block bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-5 hover:shadow-md transition">
            <div class="flex items-start justify-between">
              <div>
                <h3 class="text-lg font-bold text-gray-900 dark:text-white">${escapeHtml(e.title)}</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">${escapeHtml(e.description || '暂无描述')}</p>
              </div>
              <span class="px-3 py-1 text-xs rounded-full ${e.is_public ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400' : 'bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-400'}">${e.is_public ? '公开' : '私有'}</span>
            </div>
            <div class="flex items-center gap-4 mt-3 text-xs text-gray-400 dark:text-gray-500">
              <span>📊 ${e.question_count || 0} 题</span>
              <span>📝 ${e.submission_count || 0} 次提交</span>
              <span>⏱️ ${e.time_limit || '不限时'} 分钟</span>
              <span>💯 总分 ${e.total_score || 0}</span>
              <span>👤 ${escapeHtml(e.creator_name || '')}</span>
              <span>${new Date(e.created_at).toLocaleDateString('zh-CN')}</span>
            </div>
          </a>
        `).join('');

        const totalPages = Math.ceil(data.total / 20) || 1;
        let ph = '';
        for (let i = 1; i <= totalPages; i++) {
          ph += `<button onclick="loadExams(${i})" class="px-3 py-1 text-sm rounded-lg ${i===page?'bg-indigo-600 text-white':'bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700'}">${i}</button>`;
        }
        document.getElementById('pager').innerHTML = ph;
      } catch (err) {
        document.getElementById('list').innerHTML = `<p class="text-red-500 text-center py-8">${escapeHtml(err.message) || '加载失败'}</p>`;
      }
    }
    loadExams(1);
  </script>
</body>
</html>
