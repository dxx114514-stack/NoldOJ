<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑试卷 - NoldOJ</title>
  <link rel="stylesheet" href="/css/prose.css">
  <script src="/js/tailwind.js"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <script src="/js/api.js"></script>
  <script src="/js/purify.min.js"></script>
  <script src="/js/markdown.js"></script>
  <script src="/js/xlsx.full.min.js"></script>
  <script src="/js/exam-import.js"></script>
  <link rel="stylesheet" href="/js/katex/katex.min.css">
  <script src="/js/katex/katex.min.js"></script>
  <script src="/js/katex/auto-render.min.js"></script>
  <style type="text/tailwindcss">
    .question-block { @apply bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-6 mb-4; }
    .option-row { @apply flex items-center gap-2 mb-2; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div id="nav"></div>
  <div class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-6" id="pageTitle">创建试卷</h1>
    <div id="form" class="space-y-6">
      <!-- 基本信息 -->
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-6">
        <h2 class="text-lg font-bold text-gray-900 dark:text-white mb-4">基本信息</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">试卷标题 *</label>
            <input id="f-title" type="text" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white">
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">描述</label>
            <textarea id="f-desc" rows="2" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white resize-y"></textarea>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">时间限制（分钟，0=不限时）</label>
            <input id="f-time" type="number" value="0" min="0" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">及格分</label>
            <input id="f-pass" type="number" value="0" min="0" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">最大尝试次数（0=不限）</label>
            <input id="f-attempts" type="number" value="1" min="0" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white">
          </div>
          <div class="flex items-center gap-6">
            <label class="flex items-center gap-2"><input id="f-public" type="checkbox" checked class="w-4 h-4 text-indigo-600 rounded"><span class="text-sm text-gray-700 dark:text-gray-300">公开</span></label>
            <label class="flex items-center gap-2"><input id="f-hidden" type="checkbox" class="w-4 h-4 text-indigo-600 rounded"><span class="text-sm text-gray-700 dark:text-gray-300">隐藏</span></label>
            <label class="flex items-center gap-2"><input id="f-showanswer" type="checkbox" class="w-4 h-4 text-indigo-600 rounded"><span class="text-sm text-gray-700 dark:text-gray-300">提交后显示答案</span></label>
            <label class="flex items-center gap-2"><input id="f-ai" type="checkbox" checked class="w-4 h-4 text-indigo-600 rounded"><span class="text-sm text-gray-700 dark:text-gray-300">AI 评分</span></label>
          </div>
        </div>
      </div>

      <!-- 题目列表 -->
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-6">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
          <h2 class="text-lg font-bold text-gray-900 dark:text-white">题目列表</h2>
          <div class="flex flex-wrap items-center gap-2">
            <button onclick="document.getElementById('examImportInput').click()"
              class="px-3.5 py-2 bg-green-600 hover:bg-green-700 text-white text-sm rounded-xl transition">Excel 导入</button>
            <input type="file" id="examImportInput" accept=".xlsx,.xls,.csv" class="hidden" onchange="handleExamImport(this)">
            <button onclick="downloadExamTemplate()"
              class="px-3.5 py-2 border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 text-sm rounded-xl hover:bg-gray-50 dark:hover:bg-gray-700 transition">下载模板</button>
            <a href="/exam-sample.xlsx" download="NoldOJ试卷题目示例.xlsx"
              class="px-3.5 py-2 border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 text-sm rounded-xl hover:bg-gray-50 dark:hover:bg-gray-700 transition">示例文件</a>
            <a href="/pages/markdown-demo.html" target="_blank" rel="noopener"
              class="px-3.5 py-2 border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 text-sm rounded-xl hover:bg-gray-50 dark:hover:bg-gray-700 transition">Markdown 示例</a>
            <button onclick="addQuestion()" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-xl transition">+ 添加题目</button>
          </div>
        </div>
        <div id="questionsContainer" class="space-y-4"></div>
      </div>

      <!-- 提交按钮 -->
      <div class="flex justify-end gap-4">
        <a href="/pages/exams.html" class="px-6 py-2.5 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-700">取消</a>
        <button onclick="saveExam()" class="px-8 py-2.5 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition">保存试卷</button>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('nav').innerHTML = renderNav('exams');
    const user = getUser();
    if (!user || !['teacher','admin','su'].includes(user.role)) {
      document.getElementById('form').innerHTML = '<p class="text-center text-gray-500 py-12">需要教师权限</p>';
      throw new Error('Unauthorized');
    }

    const params = new URLSearchParams(window.location.search);
    const editId = params.get('id');
    let questions = [];
    let questionIdCounter = 0;
    let langList = [
      { name: 'c', display_name: 'C' },
      { name: 'cpp', display_name: 'C++' },
      { name: 'python3', display_name: 'Python 3' },
      { name: 'java', display_name: 'Java' },
      { name: 'javascript', display_name: 'JavaScript' }
    ];
    apiCall('GET', '/ide/languages').then(ls => {
      if (Array.isArray(ls) && ls.length) {
        langList = ls.map(l => ({ name: l.name, display_name: l.display_name }));
        if (questions.some(q => q.question_type === 'program')) renderQuestions();
      }
    }).catch(() => {});

    if (editId) {
      document.getElementById('pageTitle').textContent = '编辑试卷';
      loadExamForEdit();
    }

    async function loadExamForEdit() {
      try {
        const data = await apiCall('GET', `/exams/${editId}?show_answers=true`);
        document.getElementById('f-title').value = data.title || '';
        document.getElementById('f-desc').value = data.description || '';
        document.getElementById('f-time').value = data.time_limit || 0;
        document.getElementById('f-pass').value = data.pass_score || 0;
        document.getElementById('f-attempts').value = data.max_attempts || 1;
        document.getElementById('f-public').checked = data.is_public === 1;
        document.getElementById('f-hidden').checked = data.is_hidden === 1;
        document.getElementById('f-showanswer').checked = data.show_answer === 1;
        document.getElementById('f-ai').checked = data.allow_ai_grading === 1;

        questions = (data.questions || []).map(q => {
          const item = {
            _id: ++questionIdCounter,
            question_type: q.question_type,
            title: q.title,
            options: JSON.parse(q.options || '[]'),
            correct_answer: q.correct_answer || '',
            score: q.score || 0,
            is_subjective: q.is_subjective || 0,
            ai_grading_prompt: q.ai_grading_prompt || ''
          };
          if (q.question_type === 'program') {
            const pg = q.program || {};
            item.correct_answer = '';
            item.options = [];
            item.problem_id = pg.problem_id || q.problem_id || null;
            item.program = {
              description: pg.description || '',
              background: pg.background || '',
              input_desc: pg.input_desc || '',
              output_desc: pg.output_desc || '',
              hint: pg.hint || '',
              time_limit: Number(pg.time_limit) || 1000,
              memory_limit: Number(pg.memory_limit) || 256,
              allowed_languages: Array.isArray(pg.allowed_languages) ? pg.allowed_languages.slice() : [],
              testcases: (pg.testcases || []).map(tc => ({
                input: tc.input || '',
                output: tc.output || '',
                score: Number(tc.score) || 0,
                subtask: tc.subtask || ''
              })),
              zipBase64: null,
              zipName: ''
            };
            if (!item.program.testcases.length) {
              item.program.testcases.push({ input: '', output: '', score: 1, subtask: '' });
            }
          }
          return item;
        });
        renderQuestions();
      } catch (err) {
        alert(err.message || '加载失败');
      }
    }

    function defaultProgram() {
      return {
        description: '',
        background: '',
        input_desc: '',
        output_desc: '',
        hint: '',
        time_limit: 1000,
        memory_limit: 256,
        allowed_languages: [],
        testcases: [{ input: '', output: '', score: 1, subtask: '' }],
        zipBase64: null,
        zipName: ''
      };
    }

    function addQuestion(type) {
      const t = type || 'choice';
      const q = {
        _id: ++questionIdCounter,
        question_type: t,
        title: '',
        options: t === 'choice' ? ['', '', '', ''] : t === 'true_false' ? [] : [],
        correct_answer: '',
        score: t === 'program' ? 30 : 5,
        is_subjective: 0,
        ai_grading_prompt: ''
      };
      if (t === 'program') q.program = defaultProgram();
      questions.push(q);
      renderQuestions();
    }

    function removeQuestion(id) {
      questions = questions.filter(q => q._id !== id);
      renderQuestions();
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      if (questions.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-center py-6">点击「添加题目」，或用「Excel 导入」批量导入（格式可参考「示例文件」）</p>';
        return;
      }

      container.innerHTML = questions.map((q, i) => {
        const typeLabel = q.question_type === 'choice' ? '选择题' : q.question_type === 'true_false' ? '判断题' : q.question_type === 'fill_blank' ? '填空题' : q.question_type === 'program' ? '编程题' : '大题';
        let optionsHtml = '';

        if (q.question_type === 'choice') {
          optionsHtml = `
            <div class="mt-3">
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">选项</label>
              <div id="opts-${q._id}" class="space-y-2">
                ${q.options.map((opt, oi) => `
                  <div class="option-row">
                    <span class="w-6 text-center font-medium text-gray-500">${String.fromCharCode(65 + oi)}</span>
                    <input value="${escapeHtml(opt)}" onchange="updateOption(${q._id}, ${oi}, this.value)"
                      class="flex-1 px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-lg text-sm dark:bg-gray-700 dark:text-white">
                    <button onclick="removeOption(${q._id}, ${oi})" class="text-red-400 hover:text-red-600 text-sm">✕</button>
                  </div>
                `).join('')}
              </div>
              <button onclick="addOption(${q._id})" class="mt-2 text-sm text-indigo-600 dark:text-indigo-400 hover:underline">+ 添加选项</button>
            </div>
          `;
        } else if (q.question_type === 'true_false') {
          optionsHtml = `<p class="text-sm text-gray-400 mt-2">判断题：学生选择"正确"或"错误"</p>`;
        } else if (q.question_type === 'fill_blank') {
          optionsHtml = `
            <div class="mt-3 flex items-center gap-4">
              <label class="flex items-center gap-2">
                <input type="checkbox" ${q.is_subjective ? 'checked' : ''} onchange="questions[${i}].is_subjective = this.checked ? 1 : 0; renderQuestions()"
                class="w-4 h-4 text-indigo-600 rounded">
                <span class="text-sm text-gray-700 dark:text-gray-300">主观题（需人工/AI 评分）</span>
              </label>
            </div>
          `;
        } else if (q.question_type === 'program') {
          const pg = q.program || (q.program = defaultProgram());
          const isAllowed = n => pg.allowed_languages.length === 0 || pg.allowed_languages.includes(n);
          optionsHtml = `
            <div class="mt-3 space-y-3">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">题面描述（Markdown）</label>
                  <textarea rows="5" onchange="questions[${i}].program.description = this.value"
                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white text-sm font-mono resize-y"
                    placeholder="题目完整描述...">${escapeHtml(pg.description)}</textarea>
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">背景（可选）</label>
                  <textarea rows="5" onchange="questions[${i}].program.background = this.value"
                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white text-sm font-mono resize-y"
                    placeholder="题目背景故事...">${escapeHtml(pg.background)}</textarea>
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">输入格式</label>
                  <textarea rows="2" onchange="questions[${i}].program.input_desc = this.value"
                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white text-sm font-mono resize-y">${escapeHtml(pg.input_desc)}</textarea>
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">输出格式</label>
                  <textarea rows="2" onchange="questions[${i}].program.output_desc = this.value"
                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white text-sm font-mono resize-y">${escapeHtml(pg.output_desc)}</textarea>
                </div>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">提示（可选）</label>
                <textarea rows="2" onchange="questions[${i}].program.hint = this.value"
                  class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white text-sm font-mono resize-y">${escapeHtml(pg.hint)}</textarea>
              </div>
              <div class="grid grid-cols-2 md:grid-cols-4 gap-3 items-end">
                <div>
                  <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">时限 (ms)</label>
                  <input type="number" value="${pg.time_limit}" min="1" max="10000"
                    onchange="questions[${i}].program.time_limit = Number(this.value)"
                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm dark:bg-gray-700 dark:text-white">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">内存 (MB)</label>
                  <input type="number" value="${pg.memory_limit}" min="1" max="1048576"
                    onchange="questions[${i}].program.memory_limit = Number(this.value)"
                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm dark:bg-gray-700 dark:text-white">
                </div>
                <div class="md:col-span-2">
                  <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">允许语言（全不勾=全部允许）</label>
                  <div class="flex flex-wrap gap-x-4 gap-y-1 pt-1">
                    ${langList.map(l => `
                      <label class="flex items-center gap-1.5">
                        <input type="checkbox" ${isAllowed(l.name) ? 'checked' : ''} onchange="toggleProgLang(${q._id}, '${l.name}', this.checked)"
                          class="w-4 h-4 text-indigo-600 rounded">
                        <span class="text-sm text-gray-700 dark:text-gray-300">${escapeHtml(l.display_name)}</span>
                      </label>
                    `).join('')}
                  </div>
                </div>
              </div>
              <div>
                <div class="flex flex-wrap items-center justify-between gap-2 mb-1">
                  <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">测试点（inline 或 ZIP 二选一/并存，保存时合并）</label>
                  <div class="flex items-center gap-2">
                    <button type="button" onclick="addTc(${q._id})" class="px-2.5 py-1 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 text-xs rounded-lg hover:bg-indigo-100 dark:hover:bg-indigo-900/50">+ 添加测试点</button>
                    <button type="button" onclick="document.getElementById('zip-${q._id}').click()" class="px-2.5 py-1 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 text-xs rounded-lg hover:bg-indigo-100 dark:hover:bg-indigo-900/50">📦 上传 ZIP</button>
                    <input type="file" id="zip-${q._id}" accept=".zip" class="hidden" onchange="pickZip(${q._id}, this)">
                  </div>
                </div>
                <p class="text-xs text-gray-400 mb-2">ZIP 结构：<code>1.in/1.out</code> 平铺在根目录，或 <code>sub1/1.in</code> 子目录作为 subtask；限 ~7MB</p>
                ${pg.zipName ? `
                <div class="mb-2 px-3 py-2 bg-indigo-50 dark:bg-indigo-900/20 rounded-xl text-xs text-indigo-600 dark:text-indigo-400 flex items-center justify-between">
                  <span>📦 已选择 ${escapeHtml(pg.zipName)}（保存时解析）</span>
                  <button type="button" onclick="clearZip(${q._id})" class="text-red-500 hover:underline">移除</button>
                </div>
                ` : ''}
                <div class="space-y-2">
                  ${pg.testcases.map((tc, ti) => `
                    <div class="border border-gray-200 dark:border-gray-600 rounded-xl p-3">
                      <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                        <span class="text-xs font-medium text-gray-500">测试点 ${ti + 1}</span>
                        <div class="flex items-center gap-3">
                          <label class="text-xs text-gray-500 flex items-center gap-1">分值
                            <input type="number" value="${tc.score}" min="0" onchange="questions[${i}].program.testcases[${ti}].score = Number(this.value)"
                              class="w-16 px-2 py-1 border border-gray-300 dark:border-gray-600 rounded-lg text-xs dark:bg-gray-700 dark:text-white text-center">
                          </label>
                          <label class="text-xs text-gray-500 flex items-center gap-1">subtask
                            <input type="text" value="${escapeHtml(tc.subtask)}" placeholder="可选" onchange="questions[${i}].program.testcases[${ti}].subtask = this.value"
                              class="w-24 px-2 py-1 border border-gray-300 dark:border-gray-600 rounded-lg text-xs dark:bg-gray-700 dark:text-white">
                          </label>
                          ${pg.testcases.length > 1 ? `<button type="button" onclick="removeTc(${q._id}, ${ti})" class="text-red-400 hover:text-red-600 text-xs">删除</button>` : ''}
                        </div>
                      </div>
                      <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                        <textarea placeholder="输入数据 (input)" rows="3" onchange="questions[${i}].program.testcases[${ti}].input = this.value"
                          class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-600 rounded-lg text-xs font-mono dark:bg-gray-700 dark:text-white resize-y">${escapeHtml(tc.input)}</textarea>
                        <textarea placeholder="期望输出 (output)" rows="3" onchange="questions[${i}].program.testcases[${ti}].output = this.value"
                          class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-600 rounded-lg text-xs font-mono dark:bg-gray-700 dark:text-white resize-y">${escapeHtml(tc.output)}</textarea>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          `;
        } else {
          optionsHtml = `<p class="text-sm text-gray-400 mt-2">大题 = 单条长横线答案，必为主观题</p>`;
        }

        return `
          <div class="question-block" id="qblock-${q._id}">
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-3">
                <span class="w-8 h-8 rounded-full bg-indigo-100 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 flex items-center justify-center font-bold text-sm">${i + 1}</span>
                <select onchange="changeType(${q._id}, this.value)"
                  class="px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-lg text-sm dark:bg-gray-700 dark:text-white">
                  <option value="choice" ${q.question_type==='choice'?'selected':''}>选择题</option>
                  <option value="true_false" ${q.question_type==='true_false'?'selected':''}>判断题</option>
                  <option value="fill_blank" ${q.question_type==='fill_blank'?'selected':''}>填空题</option>
                  <option value="long_answer" ${q.question_type==='long_answer'?'selected':''}>大题</option>
                  <option value="program" ${q.question_type==='program'?'selected':''}>编程题</option>
                </select>
                <input type="number" value="${q.score}" min="0" onchange="questions[${i}].score = Number(this.value)"
                  class="w-20 px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-lg text-sm dark:bg-gray-700 dark:text-white text-center">
                <span class="text-sm text-gray-500">分</span>
              </div>
              <button onclick="removeQuestion(${q._id})" class="text-red-400 hover:text-red-600 text-sm font-medium">删除</button>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">题目内容 * <span class="text-xs font-normal text-gray-400">（支持 Markdown 与 KaTeX 公式，<a href="/pages/markdown-demo.html" target="_blank" rel="noopener" class="text-indigo-500 hover:underline">语法示例</a>）</span></label>
              <textarea oninput="previewQuestion(${q._id}, this.value)" rows="3"
                placeholder="支持 Markdown：**加粗**、\`代码\`、- 列表、\$公式\$"
                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white text-sm font-mono">${escapeHtml(q.title)}</textarea>
              <div class="mt-1 text-xs text-gray-400">预览：</div>
              <div id="tprev-${q._id}" class="mt-1 px-4 py-2 border border-dashed border-gray-200 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-900/40 text-sm text-gray-700 dark:text-gray-300 min-h-[2rem] prose dark:prose-invert max-w-none"></div>
            </div>

            ${optionsHtml}

            ${q.question_type !== 'program' ? `
            <div class="mt-3">
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">${q.question_type === 'long_answer' || (q.question_type === 'fill_blank' && q.is_subjective) ? '参考答案（可选）' : '正确答案 *'}</label>
              <input value="${escapeHtml(q.correct_answer)}" onchange="questions[${i}].correct_answer = this.value"
                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white text-sm"
                placeholder="${q.question_type === 'choice' ? '输入 A/B/C/D' : q.question_type === 'true_false' ? '输入 true 或 false' : '输入答案'}">
            </div>
            ` : ''}

            ${(q.question_type === 'long_answer' || (q.question_type === 'fill_blank' && q.is_subjective)) ? `
            <div class="mt-3">
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">AI 评分提示词（可选）</label>
              <textarea onchange="questions[${i}].ai_grading_prompt = this.value" rows="2"
                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white text-sm"
                placeholder="留空使用默认提示词">${escapeHtml(q.ai_grading_prompt || '')}</textarea>
            </div>
            ` : ''}
          </div>
        `;
      }).join('');

      questions.forEach(q => { if (q.title) previewQuestion(q._id, q.title); });
    }

    function changeType(id, type) {
      const q = questions.find(q => q._id === id);
      if (!q) return;
      q.question_type = type;
      if (type === 'choice' && (!q.options || q.options.length < 2)) q.options = ['', '', '', ''];
      if (type === 'true_false') { q.options = []; q.correct_answer = ''; }
      if (type === 'long_answer') { q.is_subjective = 1; q.options = []; }
      if (type === 'fill_blank') { q.options = []; }
      if (type === 'program') {
        if (!q.program) q.program = defaultProgram();
        q.options = [];
        q.correct_answer = '';
        q.is_subjective = 0;
        q.ai_grading_prompt = '';
      }
      renderQuestions();
    }

    function previewQuestion(id, value) {
      const q = questions.find(x => x._id === id);
      if (q) q.title = value;
      const el = document.getElementById('tprev-' + id);
      if (!el) return;
      el.innerHTML = renderMarkdown(value) || '<span class="text-gray-400">（题面预览）</span>';
      try { renderMathDefaults(el); } catch (e) {}
    }

    function addOption(qid) {
      const q = questions.find(q => q._id === qid);
      if (q) { q.options.push(''); renderQuestions(); }
    }

    function removeOption(qid, idx) {
      const q = questions.find(q => q._id === qid);
      if (q) { q.options.splice(idx, 1); renderQuestions(); }
    }

    function updateOption(qid, idx, value) {
      const q = questions.find(q => q._id === qid);
      if (q) q.options[idx] = value;
    }

    function addTc(qid) {
      const q = questions.find(x => x._id === qid);
      if (q && q.program) {
        q.program.testcases.push({ input: '', output: '', score: 1, subtask: '' });
        renderQuestions();
      }
    }

    function removeTc(qid, idx) {
      const q = questions.find(x => x._id === qid);
      if (q && q.program && q.program.testcases.length > 1) {
        q.program.testcases.splice(idx, 1);
        renderQuestions();
      }
    }

    function toggleProgLang(qid, name, on) {
      const q = questions.find(x => x._id === qid);
      if (!q || !q.program) return;
      let arr = q.program.allowed_languages;
      if (arr.length === 0) arr = langList.map(l => l.name);
      if (on) {
        if (!arr.includes(name)) arr.push(name);
      } else {
        arr = arr.filter(x => x !== name);
      }
      q.program.allowed_languages = arr;
    }

    function pickZip(qid, input) {
      const file = input.files && input.files[0];
      input.value = '';
      if (!file) return;
      if (!/\.zip$/i.test(file.name)) { alert('请选择 .zip 文件'); return; }
      if (file.size > 7 * 1024 * 1024) { alert('ZIP 文件不能超过 7MB'); return; }
      const q = questions.find(x => x._id === qid);
      if (!q || !q.program) return;
      const reader = new FileReader();
      reader.onload = () => {
        q.program.zipBase64 = String(reader.result).split(',')[1] || '';
        q.program.zipName = file.name;
        renderQuestions();
      };
      reader.onerror = () => alert('读取文件失败');
      reader.readAsDataURL(file);
    }

    function clearZip(qid) {
      const q = questions.find(x => x._id === qid);
      if (q && q.program) {
        q.program.zipBase64 = null;
        q.program.zipName = '';
        renderQuestions();
      }
    }

    function downloadExamTemplate() {
      try {
        NoldExamImport.downloadTemplate();
      } catch (err) {
        alert(err.message || '模板下载失败');
      }
    }

    async function handleExamImport(input) {
      const file = input.files && input.files[0];
      input.value = '';
      if (!file) return;

      let res;
      try {
        res = await NoldExamImport.importFile(file);
      } catch (err) {
        alert('Excel 导入失败: ' + (err && err.message ? err.message : err));
        return;
      }

      const errs = (res.errors || []).filter(e => e.indexOf('提示：') !== 0);
      const notes = (res.errors || []).filter(e => e.indexOf('提示：') === 0);

      if (!res.questions.length) {
        alert('没有解析出任何题目' + (errs.length ? '：\n' + errs.slice(0, 10).join('\n') + (errs.length > 10 ? `\n… 共 ${errs.length} 条` : '') : ''));
        return;
      }

      let msg = `解析出 ${res.questions.length} 道题目`;
      if (questions.length) msg += `，将追加到现有 ${questions.length} 道题目之后`;
      if (errs.length) {
        msg += `；${errs.length} 条存在问题会被跳过：\n` + errs.slice(0, 8).join('\n') + (errs.length > 8 ? `\n… 共 ${errs.length} 条` : '');
      }
      if (notes.length) msg += '\n' + notes.join('\n');

      if ((questions.length || errs.length) && !confirm(msg + '\n\n是否继续导入？')) return;

      res.questions.forEach(q => {
        questions.push(Object.assign({ _id: ++questionIdCounter }, q));
      });
      renderQuestions();
    }

    async function saveExam() {
      const title = document.getElementById('f-title').value.trim();
      if (!title) { alert('请输入试卷标题'); return; }

      if (questions.length === 0) { alert('请至少添加一道题目'); return; }

      for (let vi = 0; vi < questions.length; vi++) {
        const q = questions[vi];
        if (q.question_type !== 'program') continue;
        const pg = q.program;
        if (!pg) { alert(`第 ${vi + 1} 题：编程题配置缺失`); return; }
        const hasTc = pg.testcases.some(tc => (tc.input || '').length || (tc.output || '').length);
        if (!hasTc && !pg.zipBase64) {
          alert(`第 ${vi + 1} 题：请至少填写一个测试点，或上传测试数据 ZIP`);
          return;
        }
        if (pg.allowed_languages.length === 0) pg.allowed_languages = langList.map(l => l.name);
        pg.time_limit = Math.min(10000, Math.max(1, Number(pg.time_limit) || 1000));
        pg.memory_limit = Math.min(1048576, Math.max(1, Number(pg.memory_limit) || 256));
      }

      const payload = {
        title,
        description: document.getElementById('f-desc').value.trim(),
        time_limit: parseInt(document.getElementById('f-time').value) || 0,
        pass_score: parseInt(document.getElementById('f-pass').value) || 0,
        max_attempts: parseInt(document.getElementById('f-attempts').value) || 1,
        show_answer: document.getElementById('f-showanswer').checked,
        is_public: document.getElementById('f-public').checked,
        is_hidden: document.getElementById('f-hidden').checked,
        allow_ai_grading: document.getElementById('f-ai').checked,
        questions: questions.map((q, i) => {
          const item = {
            question_type: q.question_type,
            title: q.title,
            options: q.question_type === 'program' ? [] : q.options,
            correct_answer: q.question_type === 'program' ? '' : q.correct_answer,
            score: q.score,
            sort_order: i,
            is_subjective: q.question_type === 'program' ? 0 : q.is_subjective,
            ai_grading_prompt: q.question_type === 'program' ? '' : q.ai_grading_prompt
          };
          if (q.question_type === 'program') {
            const pg = q.program;
            item.problem_id = q.problem_id || undefined;
            item.problem = {
              description: pg.description,
              background: pg.background,
              input_desc: pg.input_desc,
              output_desc: pg.output_desc,
              hint: pg.hint,
              time_limit: pg.time_limit,
              memory_limit: pg.memory_limit,
              allowed_languages: pg.allowed_languages,
              testcases: pg.testcases
                .filter(tc => (tc.input || '').length || (tc.output || '').length)
                .map(tc => ({ input: tc.input, output: tc.output, score: Number(tc.score) || 0, subtask: tc.subtask || '' })),
              testcase_zip_base64: pg.zipBase64 || undefined
            };
          }
          return item;
        })
      };

      try {
        if (editId) {
          await apiCall('PUT', `/exams/${editId}`, payload);
        } else {
          await apiCall('POST', '/exams', payload);
        }
        window.location.href = '/pages/exams.html';
      } catch (err) {
        alert(err.message || '保存失败');
      }
    }

    renderQuestions();
  </script>
</body>
</html>
