<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - NoldOJ</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/js/tailwind.js"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <script src="/js/api.js"></script>
  <style>
    .captcha-svg svg { display: block; }
    .captcha-svg { background: #fff; border-radius: 0.5rem; }
    .dark .captcha-svg { border-color: #4b5563 !important; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div id="nav"></div>
  <div class="max-w-md mx-auto mt-16 px-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-8 border border-gray-100 dark:border-gray-700">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">创建账户</h1>
        <p class="text-gray-500 dark:text-gray-400 mt-2">加入 NoldOJ，开始编程之旅</p>
      </div>
      <div id="error" class="hidden mb-4 p-3 bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300 rounded-lg text-sm"></div>
      <form onsubmit="handleRegister(event)">
        <div id="emailSection" class="mb-4 hidden">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">邮箱</label>
          <div class="flex space-x-2">
            <input id="email" type="email" class="flex-1 px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition dark:bg-gray-700 dark:text-white" placeholder="your@email.com">
            <button type="button" id="sendCodeBtn" onclick="sendCode()" class="px-4 py-2.5 bg-indigo-100 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 rounded-xl text-sm font-medium hover:bg-indigo-200 dark:hover:bg-indigo-900/50 transition whitespace-nowrap">发送验证码</button>
          </div>
          <div class="mt-2 flex space-x-2">
            <input id="emailCode" type="text" maxlength="6" class="flex-1 px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition dark:bg-gray-700 dark:text-white" placeholder="6位验证码">
            <span id="emailStatus" class="flex items-center text-sm text-gray-400"></span>
          </div>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">用户名</label>
          <input id="username" type="text" required minlength="3" maxlength="32" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition dark:bg-gray-700 dark:text-white" placeholder="3-32 个字符">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">昵称</label>
          <input id="nickname" type="text" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition dark:bg-gray-700 dark:text-white" placeholder="选填">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">密码</label>
          <input id="password" type="password" required minlength="6" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition dark:bg-gray-700 dark:text-white" placeholder="至少 6 个字符">
        </div>
        <div id="captchaSection" class="mb-4 hidden">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">验证码</label>
          <div class="flex space-x-2">
            <input id="captchaCode" type="text" minlength="4" maxlength="4" class="flex-1 px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition dark:bg-gray-700 dark:text-white uppercase" placeholder="请输入验证码">
            <div id="captchaImg" class="captcha-svg cursor-pointer border border-gray-300 dark:border-gray-600 rounded-xl overflow-hidden hover:opacity-80 transition flex items-center justify-center" title="点击刷新验证码" style="min-width:130px;"></div>
          </div>
        </div>
        <button type="submit" id="regBtn" class="w-full py-2.5 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition">创建账户</button>
      </form>
      <p class="text-center mt-6 text-sm text-gray-500 dark:text-gray-400">已有账号？<a href="/pages/login.html" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 font-medium">立即登录</a></p>
    </div>
  </div>
  <script>
    document.getElementById('nav').innerHTML = renderNav('');
    let captchaId = '';
    let captchaEnabled = false;
    let emailEnabled = false;
    let codeTimer = null;

    async function init() {
      try {
        const [emailData] = await Promise.all([
          apiCall('GET', '/auth/email-enabled')
        ]);
        emailEnabled = emailData.enabled;
        if (emailEnabled) {
          document.getElementById('emailSection').classList.remove('hidden');
        }
      } catch {}
      loadCaptcha((s) => {
        captchaId = s.id;
        captchaEnabled = s.enabled;
      });
    }
    init();

    async function sendCode() {
      const email = document.getElementById('email').value.trim();
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById('emailStatus').textContent = '请输入有效邮箱';
        document.getElementById('emailStatus').className = 'flex items-center text-sm text-red-500';
        return;
      }
      if (captchaEnabled && !document.getElementById('captchaCode').value) {
        document.getElementById('emailStatus').textContent = '请先完成图形验证码';
        document.getElementById('emailStatus').className = 'flex items-center text-sm text-red-500';
        return;
      }
      const btn = document.getElementById('sendCodeBtn');
      btn.disabled = true; btn.textContent = '发送中...';
      try {
        const body = { email };
        if (captchaEnabled) {
          body.captcha_id = captchaId;
          body.captcha_code = document.getElementById('captchaCode').value;
        }
        await apiCall('POST', '/auth/send-code', body);
        document.getElementById('emailStatus').textContent = '已发送';
        document.getElementById('emailStatus').className = 'flex items-center text-sm text-green-600';
        let sec = 60;
        btn.textContent = `${sec}s`;
        codeTimer = setInterval(() => {
          sec--;
          if (sec <= 0) {
            clearInterval(codeTimer);
            btn.disabled = false; btn.textContent = '发送验证码';
          } else {
            btn.textContent = `${sec}s`;
          }
        }, 1000);
      } catch (err) {
        document.getElementById('emailStatus').textContent = err.message || '发送失败';
        document.getElementById('emailStatus').className = 'flex items-center text-sm text-red-500';
        btn.disabled = false; btn.textContent = '发送验证码';
        if (captchaEnabled) {
          document.getElementById('captchaCode').value = '';
          loadCaptcha((s) => {
            captchaId = s.id;
            captchaEnabled = s.enabled;
          });
        }
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('regBtn');
      btn.disabled = true; btn.textContent = '创建中...';
      hideError('error');
      try {
        const body = {
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
          nickname: document.getElementById('nickname').value,
          email: emailEnabled ? document.getElementById('email').value.trim() : '',
          email_code: emailEnabled ? document.getElementById('emailCode').value.trim() : ''
        };
        if (captchaEnabled) {
          body.captcha_id = captchaId;
          body.captcha_code = document.getElementById('captchaCode').value;
        }
        const data = await apiCall('POST', '/auth/register', body);
        setToken(data.access_token);
        setUser(data.user);
        window.location.href = '/pages/index.html';
      } catch (err) {
        showError('error', err.message || '注册失败');
        btn.disabled = false; btn.textContent = '创建账户';
        if (captchaEnabled) {
          document.getElementById('captchaCode').value = '';
          loadCaptcha((s) => {
            captchaId = s.id;
            captchaEnabled = s.enabled;
          });
        }
      }
    }
  </script>
</body>
</html>
