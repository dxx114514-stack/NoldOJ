<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>虚拟比赛 - NoldOJ</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/js/tailwind.js"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <script src="/js/api.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div id="nav"></div>
  <div class="max-w-5xl mx-auto px-4 py-8">
    <div id="content" class="text-center py-12 text-gray-400">加载中...</div>
  </div>
  <script>
    document.getElementById('nav').innerHTML = renderNav('contests');
    const params = new URLSearchParams(window.location.search);
    const vcid = params.get('id');
    let countdownTimer = null;

    async function load() {
      if (!vcid) { document.getElementById('content').innerHTML = '<p class="text-red-500">未指定虚拟比赛 ID</p>'; return; }
      try {
        const vc = await apiCall('GET', `/virtual-contests/${vcid}`);
        document.title = `虚拟比赛 - ${vc.contest.title} - NoldOJ`;

        const ended = vc.status === 'finished';
        const remainingMin = Math.floor(vc.remaining_ms / 60000);
        const hours = Math.floor(remainingMin / 60);
        const mins = remainingMin % 60;
        const secs = Math.floor((vc.remaining_ms % 60000) / 1000);
        const countdownText = ended
          ? '已结束'
          : `⏱ 剩余 ${String(hours).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;

        const problemsHtml = (vc.problems || []).map((p, i) => `
          <tr class="hover:bg-gray-50 dark:hover:bg-gray-700 dark:bg-gray-700">
            <td class="px-4 py-3 text-sm font-mono text-gray-500 dark:text-gray-400 dark:text-gray-500">${p.alias || '#' + p.id}</td>
            <td class="px-4 py-3 text-sm"><a href="/pages/problem.html?id=${p.problem_id}" class="text-indigo-600 dark:text-indigo-400 hover:underline">${escapeHtml(p.title)}</a></td>
            <td class="px-4 py-3 text-center text-xs text-gray-400">${p.time_limit}ms / ${p.memory_limit}MB</td>
            <td class="px-4 py-3 text-center">
              <a href="/pages/submit.html?id=${p.problem_id}&vc=${vc.id}" class="px-3 py-1 text-xs bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 rounded hover:bg-indigo-100 dark:hover:bg-indigo-900/50">提交</a>
            </td>
          </tr>
        `).join('');

        // 排行榜（自己）
        let rankingHtml = '';
        try {
          const lb = await apiCall('GET', `/virtual-contests/${vcid}/ranking`);
          if (lb.leaderboard && lb.leaderboard.length > 0) {
            const u = lb.leaderboard[0];
            rankingHtml = `
              <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 overflow-hidden mt-4">
                <table class="w-full">
                  <thead class="bg-gray-50 dark:bg-gray-700 border-b border-gray-200 dark:border-gray-700">
                    <tr>
                      <th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase">排名</th>
                      <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">用户</th>
                      ${lb.problem_ids.map(pid => `<th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase">#${pid}</th>`).join('')}
                      <th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase">总分</th>
                      <th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase">总耗时</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr class="bg-yellow-50 dark:bg-yellow-900/20">
                      <td class="px-4 py-3 text-center font-bold">1</td>
                      <td class="px-4 py-3 text-sm font-medium">${escapeHtml(u.nickname || u.username)} <span class="text-xs text-gray-400">(你)</span></td>
                      ${lb.problem_ids.map(pid => {
                        const p = u.problems[pid];
                        return `<td class="px-4 py-3 text-center text-sm">${p ? (p.status==='accepted'?`<span class="text-green-600 dark:text-green-400">${p.score}</span>`:`<span class="text-red-400">X</span>`) : '<span class="text-gray-300">-</span>'}</td>`;
                      }).join('')}
                      <td class="px-4 py-3 text-center text-sm font-bold">${u.total_score}</td>
                      <td class="px-4 py-3 text-center text-sm">${u.total_time}ms</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            `;
          }
        } catch {}

        const recentSubs = (vc.submissions || []).slice(0, 10).map(s => `
          <tr>
            <td class="px-3 py-2 text-xs text-gray-400">#${s.id}</td>
            <td class="px-3 py-2 text-xs"><a href="/pages/submission.html?id=${s.id}" class="text-indigo-600 dark:text-indigo-400 hover:underline">查看</a></td>
            <td class="px-3 py-2 text-xs"><span class="${statusColor(s.status)} px-2 py-0.5 rounded text-xs">${statusText(s.status)}</span></td>
            <td class="px-3 py-2 text-xs text-gray-400">${new Date(s.created_at).toLocaleTimeString()}</td>
          </tr>
        `).join('');

        document.getElementById('content').innerHTML = `
          <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-6 mb-4">
            <div class="flex items-start justify-between mb-4">
              <div>
                <h1 class="text-3xl font-bold text-gray-900 dark:text-white">${escapeHtml(vc.contest.title)}</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">虚拟比赛 #${vc.id} · ${new Date(vc.start_time).toLocaleString()} ~ ${new Date(vc.end_time).toLocaleString()}</p>
              </div>
              <div class="text-right">
                <div id="countdown" class="px-4 py-2 ${ended ? 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300' : 'bg-purple-100 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300'} rounded-xl text-lg font-mono font-bold">${countdownText}</div>
                <a href="/pages/my-virtual-contests.html" class="block mt-2 text-xs text-purple-600 dark:text-purple-400 hover:underline">← 我的虚拟比赛</a>
              </div>
            </div>
          </div>

          <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 overflow-hidden mb-4">
            <div class="px-6 py-3 border-b border-gray-100 dark:border-gray-700">
              <h2 class="text-lg font-semibold text-gray-900 dark:text-white">题目列表</h2>
            </div>
            <table class="w-full">
              <thead class="bg-gray-50 dark:bg-gray-700 border-b border-gray-200 dark:border-gray-700">
                <tr>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">编号</th>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">标题</th>
                  <th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase">限制</th>
                  <th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase">操作</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-100 dark:divide-gray-700">${problemsHtml || '<tr><td colspan="4" class="px-4 py-8 text-center text-gray-400">暂无题目</td></tr>'}</tbody>
            </table>
          </div>

          <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-3 mt-6">我的排名</h2>
          ${rankingHtml || '<p class="text-gray-400 text-center py-4">暂无排名数据</p>'}

          <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-3 mt-6">最近提交</h2>
          ${(vc.submissions || []).length > 0 ? `
            <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 overflow-hidden">
              <table class="w-full">
                <thead class="bg-gray-50 dark:bg-gray-700 border-b border-gray-200 dark:border-gray-700">
                  <tr>
                    <th class="px-3 py-2 text-left text-xs font-semibold text-gray-500 uppercase">ID</th>
                    <th class="px-3 py-2 text-left text-xs font-semibold text-gray-500 uppercase">详情</th>
                    <th class="px-3 py-2 text-left text-xs font-semibold text-gray-500 uppercase">状态</th>
                    <th class="px-3 py-2 text-left text-xs font-semibold text-gray-500 uppercase">时间</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-100 dark:divide-gray-700">${recentSubs}</tbody>
              </table>
            </div>
          ` : '<p class="text-gray-400 text-center py-4">暂无提交</p>'}
        `;

        // 启动倒计时
        if (!ended) startCountdown(new Date(vc.end_time).getTime());
      } catch (err) {
        document.getElementById('content').innerHTML = `<p class="text-red-500 text-center">${escapeHtml(err.message) || '加载失败'}</p>`;
      }
    }

    function startCountdown(endMs) {
      if (countdownTimer) clearInterval(countdownTimer);
      const el = document.getElementById('countdown');
      if (!el) return;
      countdownTimer = setInterval(() => {
        const remaining = endMs - Date.now();
        if (remaining <= 0) {
          clearInterval(countdownTimer);
          el.textContent = '已结束';
          el.className = 'px-4 py-2 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-xl text-lg font-mono font-bold';
          if (confirm('虚拟比赛已结束！是否刷新查看最终结果？')) load();
          return;
        }
        const h = Math.floor(remaining / 3600000);
        const m = Math.floor((remaining % 3600000) / 60000);
        const s = Math.floor((remaining % 60000) / 1000);
        el.textContent = `⏱ 剩余 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      }, 1000);
    }

    load();
  </script>
</body>
</html>
