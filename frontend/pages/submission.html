<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提交详情 - WinOJ</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/js/tailwind.js"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <script src="/js/api.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" integrity="sha384-zaeBlB/vwYsDRSlFajnDd7OydJ0cWk+c2OWybl3eSUf6hW2EbhlCsQPqKr3gkznT" crossorigin="anonymous">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js" integrity="sha384-ZYmwuq4n2gOcNxMSiJ6jyTj+BbIrilr7p6dlq6q5nmSWKmsH9UU4K1qqjycMkfmR" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js" integrity="sha384-o9m634t2Hy35pPNKd9Xe16ntbSw11jCOuKPDrzQGXI8k87L2JZthaA3rwmJjnF7Z" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js" integrity="sha384-Xy+2exU6lBoT4OpUOtnQb+cUpn+nlJQEHvRobWVtwz6wIsw4oNoO7xyd/l8rYgMy" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js" integrity="sha384-g0o+WW9mdIxA7LaaCKTkRm0M5TVT+Bb4s9eocxPsI2G0Xm0POG9iD6G6qP1IIsfS" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/diff@5/dist/diff.min.js" integrity="sha384-6j7Q9TJB4vm12GtmUgqRCIMEWPWht9ntvatRve5IgkjH2G8wyrgKCSF0maDt+eBa" crossorigin="anonymous"></script>
  <style>.CodeMirror { height: 400px; font-size: 13px; border-radius: 0.5rem; text-align: left; overflow: hidden; }
  .CodeMirror-code { text-align: left !important; }
  .diff-panel { font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; }
  .diff-line { display: flex; padding: 0 8px; white-space: pre; }
  .diff-line-add { background: #e6ffec; color: #22863a; }
  .diff-line-del { background: #ffebe9; color: #cb2431; }
  .diff-line-ctx { background: transparent; color: inherit; }
  .diff-line-hunk { background: #f1f8ff; color: #032f62; font-weight: 600; }
  .dark .diff-line-add { background: #1a3a2a; color: #7ee78c; }
  .dark .diff-line-del { background: #3a1a1a; color: #f87171; }
  .dark .diff-line-ctx { color: #d1d5db; }
  .dark .diff-line-hunk { background: #1e3a5f; color: #93c5fd; }
  .diff-lineno { display: inline-block; width: 3em; color: #999; user-select: none; text-align: right; padding-right: 8px; }
  .file-tab { cursor: pointer; user-select: none; }
  .file-tab.active { background: #6366f1; color: white; }
  .file-tab:not(.active) { background: #e5e7eb; color: #374151; }
  .dark .file-tab:not(.active) { background: #374151; color: #d1d5db; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div id="nav"></div>
  <div class="max-w-5xl mx-auto px-4 py-8">
    <div id="content" class="text-center py-12 text-gray-400 dark:text-gray-500 dark:text-gray-400">加载中...</div>
  </div>
  <script>
    document.getElementById('nav').innerHTML = renderNav('submissions');
    const params = new URLSearchParams(window.location.search);
    const sid = params.get('id');
    const currentUser = getUser();
    const isTeacher = currentUser && ['teacher', 'admin', 'su'].includes(currentUser.role);
    let currentSourceCode = '';

    function errorDescription(status, stderr, exitCode, timeUsed, timeLimit) {
      const descs = {
        compile_error: '代码编译失败，请检查语法错误。编译器输出见下方。',
        runtime_error: `程序运行时崩溃（退出码: ${exitCode}）。可能是数组越界、空指针、除零等错误。`,
        time_limit_exceeded: `程序运行超过时限（${timeLimit || '?'}ms）。请优化算法复杂度或减少不必要的计算。`,
        memory_limit_exceeded: '程序使用内存超过限制。请减少内存分配或使用更高效的数据结构。',
        wrong_answer: '程序输出与标准答案不一致。请仔细检查逻辑和边界情况。',
        accepted: '程序正确通过了所有测试点。',
        system_error: '评测系统内部错误，请联系管理员。',
        skipped: '因依赖的子任务未通过，本测试点跳过执行。',
        pending: '等待评测中...',
        running: '正在评测中...',
        judging: '正在评测中...',
        compiling: '正在编译中...',
        pending_rejudge: '等待重测中...'
      };
      return descs[status] || `状态: ${status}`;
    }

    async function loadSubmission() {
      if (!sid) { document.getElementById('content').innerHTML = '<p class="text-red-500">未指定提交 ID</p>'; return; }
      try {
        const s = await apiCall('GET', `/submissions/${sid}`);
        currentSourceCode = s.source_code || '';
        document.title = `提交 #${s.id} - WinOJ`;
        const langModes = { c: 'text/x-csrc', cpp: 'text/x-c++src', python3: 'text/x-python', java: 'text/x-java', javascript: 'text/javascript' };

        const statusDesc = errorDescription(s.status, s.compile_output, null, s.time_used, s.time_limit);

        let detailsHtml = '';
        if (s.details && s.details.length > 0) {
          const groups = {};
          const noGroup = [];
          for (const d of s.details) {
            const key = d.subtask_id || d.group_subtask_id || '';
            if (key) {
              if (!groups[key]) groups[key] = [];
              groups[key].push(d);
            } else {
              noGroup.push(d);
            }
          }

          function renderDetail(d, idx) {
            let detailDesc = '';
            const isSkipped = d.status === 'skipped';
            if (isSkipped) detailDesc = `<div class="text-xs text-gray-500 dark:text-gray-400 mt-1 ml-6">因依赖的子任务未通过，本测试点跳过执行</div>`;
            else if (d.status === 'runtime_error') detailDesc = `<div class="text-xs text-red-500 mt-1 ml-6">退出码: ${d.exit_code}${d.stderr ? ' — ' + escapeHtml(d.stderr.slice(0, 200)) : ''}</div>`;
            else if (d.status === 'time_limit_exceeded') detailDesc = `<div class="text-xs text-orange-500 mt-1 ml-6">耗时 ${d.time_used}ms 超出时限</div>`;
            else if (d.status === 'memory_limit_exceeded') detailDesc = `<div class="text-xs text-orange-500 mt-1 ml-6">使用内存 ${d.memory_used}KB 超出限制</div>`;
            else if (d.status === 'wrong_answer') detailDesc = `<div class="text-xs text-red-400 mt-1 ml-6">输出与期望不一致${d.stdout ? '（收到: ' + escapeHtml(d.stdout.slice(0, 100)) + '）' : ''}</div>`;
            else if (d.status === 'system_error') detailDesc = `<div class="text-xs text-red-600 mt-1 ml-6">评测系统内部错误，请联系管理员</div>`;
            else if (d.status === 'compile_error') detailDesc = `<div class="text-xs text-yellow-600 dark:text-yellow-400 mt-1 ml-6 whitespace-pre-wrap">${escapeHtml((d.stderr || '').slice(0, 300))}</div>`;
            return `
              <div class="p-3 ${isSkipped ? 'bg-gray-100 dark:bg-gray-800 opacity-60' : 'bg-gray-50 dark:bg-gray-700'} rounded-xl">
                <div class="flex items-center justify-between">
                  <div class="flex items-center space-x-3">
                    <span class="text-sm font-medium text-gray-700 dark:text-gray-300">测试点 #${idx}</span>
                    <span class="px-2 py-0.5 text-xs rounded-full ${statusColor(d.status)}">${statusText(d.status)}</span>
                  </div>
                  <div class="flex items-center space-x-4 text-sm text-gray-500 dark:text-gray-400 dark:text-gray-500">
                    <span>得分: ${d.score}</span>
                    <span>耗时: ${isSkipped ? '-' : d.time_used + 'ms'}</span>
                    <span>内存: ${isSkipped ? '-' : d.memory_used + 'KB'}</span>
                  </div>
                </div>
                ${detailDesc}
              </div>
            `;
          }

          let groupedHtml = '';
          let idx = 1;
          for (const [subtaskId, items] of Object.entries(groups)) {
            const groupScore = s.test_groups && s.test_groups.find(g => g.subtask_id === subtaskId);
            const groupMax = groupScore ? groupScore.score : 0;
            const groupAllSkipped = items.every(d => d.status === 'skipped');
            const groupAllAccepted = items.every(d => d.status === 'accepted');
            const groupStatus = groupAllSkipped ? 'skipped'
              : groupAllAccepted ? 'accepted'
              : (items.some(d => d.status === 'time_limit_exceeded') ? 'time_limit_exceeded'
                : items.some(d => d.status === 'memory_limit_exceeded') ? 'memory_limit_exceeded'
                : items.some(d => d.status === 'runtime_error') ? 'runtime_error'
                : items.some(d => d.status === 'system_error') ? 'system_error'
                : items.some(d => d.status === 'compile_error') ? 'compile_error'
                : 'wrong_answer');
            const groupScoreEarned = groupAllAccepted ? items.reduce((s, d) => s + (d.score || 0), 0) : 0;
            const groupBg = groupAllSkipped ? 'bg-gray-50 dark:bg-gray-800' : 'bg-indigo-50 dark:bg-indigo-900/30';
            const groupTitleColor = groupAllSkipped ? 'text-gray-600 dark:text-gray-400' : 'text-indigo-700 dark:text-indigo-300';

            groupedHtml += `
              <div class="mb-4 border border-gray-200 dark:border-gray-700 rounded-xl overflow-hidden ${groupAllSkipped ? 'opacity-70' : ''}">
                <div class="px-4 py-3 ${groupBg} flex items-center justify-between">
                  <div class="flex items-center space-x-3">
                    <span class="text-sm font-semibold ${groupTitleColor}">子任务 ${escapeHtml(subtaskId)}</span>
                    <span class="px-2 py-0.5 text-xs rounded-full ${statusColor(groupStatus)}">${statusText(groupStatus)}</span>
                  </div>
                  <div class="text-sm font-semibold text-gray-700 dark:text-gray-300">
                    ${groupAllSkipped ? '<span class="text-gray-500">依赖未通过</span>' : `得分: ${groupScoreEarned} / ${groupMax}`}
                  </div>
                </div>
                <div class="p-2 space-y-2">
                  ${items.map(d => renderDetail(d, idx++)).join('')}
                </div>
              </div>
            `;
          }

          let noGroupHtml = '';
          if (noGroup.length > 0) {
            noGroupHtml = `
              <div class="space-y-2">
                ${noGroup.map(d => renderDetail(d, idx++)).join('')}
              </div>
            `;
          }

          detailsHtml = `
            <div class="mt-6">
              <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-3">测试点详情</h3>
              ${groupedHtml}
              ${noGroupHtml}
            </div>
          `;
        }

        document.getElementById('content').innerHTML = `
          <div class="bg-white dark:bg-gray-800 dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-6">
            <div class="flex items-center justify-between mb-6">
              <div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">提交 #${s.id}</h1>
                <div class="flex items-center space-x-3 mt-2 text-sm text-gray-500 dark:text-gray-400 dark:text-gray-500">
                  <span>用户: <a href="profile.html?id=${s.user_id}" class="text-indigo-600 dark:text-indigo-400 hover:underline">${escapeHtml(s.username||'-')}</a></span>
                  <span>|</span>
                  <a href="problem.html?id=${s.problem_id}" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-800">${escapeHtml(s.problem_title||'未知')}</a>
                  <span>|</span>
                  <span>${s.language}</span>
                  <span>|</span>
                  <span>${new Date(s.created_at).toLocaleString()}</span>
                </div>
              </div>
              <div class="flex items-center space-x-3">
                <span data-status-badge class="px-4 py-2 text-sm rounded-full font-semibold ${statusColor(s.status)}">${statusText(s.status)}</span>
                ${isTeacher ? `<button onclick="rejudge(${s.id})" class="px-4 py-2 bg-orange-50 dark:bg-orange-900/300 text-white text-sm rounded-xl hover:bg-orange-600 font-semibold">重测</button>` : ''}
              </div>
            </div>

            <div class="p-3 mb-4 rounded-xl text-sm ${s.status === 'accepted' ? 'bg-green-50 dark:bg-green-900/30 text-green-700 dark:text-green-300' : 'bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-400 dark:text-gray-500'}">
              ${statusDesc}
            </div>

            <div class="grid grid-cols-3 gap-4 mb-6">
              <div class="bg-gray-50 dark:bg-gray-700 rounded-xl p-4 text-center"><div class="text-2xl font-bold text-gray-900 dark:text-white">${s.score}</div><div class="text-sm text-gray-500 dark:text-gray-400 dark:text-gray-500">得分</div></div>
              <div class="bg-gray-50 dark:bg-gray-700 rounded-xl p-4 text-center"><div class="text-2xl font-bold text-gray-900 dark:text-white">${s.time_used}ms</div><div class="text-sm text-gray-500 dark:text-gray-400 dark:text-gray-500">耗时</div></div>
              <div class="bg-gray-50 dark:bg-gray-700 rounded-xl p-4 text-center"><div class="text-2xl font-bold text-gray-900 dark:text-white">${s.memory_used}KB</div><div class="text-sm text-gray-500 dark:text-gray-400 dark:text-gray-500">内存</div></div>
            </div>

            ${s.source_code && s.source_code !== '[HIDDEN]' ? `
            <div class="mb-4">
              <div class="flex items-center justify-between mb-2">
                <h3 class="text-lg font-semibold text-gray-900 dark:text-white">源代码</h3>
                <div class="flex items-center space-x-2">
                  <button id="diffBtn" onclick="toggleCodeDiff()" class="hidden px-3 py-1.5 bg-indigo-100 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300 text-sm rounded-lg hover:bg-indigo-200 dark:hover:bg-indigo-900/60 transition">与上次对比</button>
                  ${isTeacher ? `<button onclick="copyCode(this)" class="px-3 py-1.5 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 text-sm rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition" title="复制源代码">复制代码</button>` : ''}
                </div>
              </div>
              ${(s.files && s.files.length > 1) ? `
                <div id="submissionFileTabs" class="flex items-center space-x-1 mb-2 flex-wrap"></div>
                <textarea id="codeArea">${escapeHtml(s.files[0].content)}</textarea>
              ` : `
                <textarea id="codeArea">${escapeHtml(s.source_code)}</textarea>
              `}
              <div id="codeDiffPanel" class="hidden mt-3 border border-gray-200 dark:border-gray-700 rounded-xl overflow-hidden">
                <div class="px-4 py-2 bg-gray-50 dark:bg-gray-700 flex items-center justify-between">
                  <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">代码差异 (vs 上次提交 #<span id="diffPrevId"></span>)</span>
                  <button onclick="toggleCodeDiff()" class="text-xs text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300">收起</button>
                </div>
                <div id="codeDiffContent" class="diff-panel overflow-x-auto max-h-96 overflow-y-auto"></div>
              </div>
            </div>
            ` : ''}

            <div id="waDiffSection" class="hidden mb-4">
              <div class="flex items-center justify-between mb-2">
                <h3 class="text-lg font-semibold text-gray-900 dark:text-white">输出对比 (Wrong Answer)</h3>
                <button onclick="toggleWaDiff()" class="px-3 py-1.5 bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-300 text-sm rounded-lg hover:bg-red-200 dark:hover:bg-red-900/60 transition">展开/收起</button>
              </div>
              <div id="waDiffPanel" class="hidden border border-gray-200 dark:border-gray-700 rounded-xl overflow-hidden">
                <div id="waDiffContent" class="diff-panel overflow-x-auto max-h-96 overflow-y-auto"></div>
              </div>
            </div>

            ${s.compile_output ? `
            <div class="mb-4">
              <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">编译输出</h3>
              <pre class="bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300 p-4 rounded-xl text-sm overflow-x-auto whitespace-pre-wrap">${escapeHtml(s.compile_output)}</pre>
            </div>
            ` : ''}

            ${detailsHtml}
          </div>
        `;
        if (s.source_code && s.source_code !== '[HIDDEN]') {
          const ta = document.getElementById('codeArea');
          if (ta) {
            const cm = CodeMirror.fromTextArea(ta, { lineNumbers: true, mode: langModes[s.language]||'text/plain', readOnly: true, theme: 'default' });
            // 多文件 tab 切换
            if (s.files && s.files.length > 1) {
              const tabsBar = document.getElementById('submissionFileTabs');
              if (tabsBar) {
                tabsBar.innerHTML = s.files.map((f, i) => `
                  <div class="file-tab ${i === 0 ? 'active' : ''} px-3 py-1.5 rounded-t-lg text-sm font-medium" onclick="switchSubmissionFile(${i})" data-idx="${i}">
                    ${escapeHtml(f.filename)}
                  </div>
                `).join('');
                window._submissionFiles = s.files;
                window._submissionCM = cm;
                window.switchSubmissionFile = function(idx) {
                  if (!window._submissionFiles || !window._submissionFiles[idx]) return;
                  window._submissionCM.setValue(window._submissionFiles[idx].content);
                  document.querySelectorAll('#submissionFileTabs .file-tab').forEach((el, i) => {
                    el.classList.toggle('active', i === idx);
                  });
                };
              }
            }
          }
        }
        loadDiff();
        // 加入 socket 房间监听评测状态
        if (s.status === 'pending' || s.status === 'running' || s.status === 'judging' || s.status === 'compiling' || s.status === 'pending_review' || s.status === 'pending_rejudge') {
          joinSubmissionRoom(s.id);
          window.onJudgeStatus = function(msg) {
            if (msg.submission_id !== s.id) return;
            const badge = document.querySelector('[data-status-badge]');
            if (badge) {
              badge.className = `px-4 py-2 text-sm rounded-full font-semibold ${statusColor(msg.status)}`;
              badge.textContent = statusText(msg.status);
            }
            if (['accepted', 'wrong_answer', 'time_limit_exceeded', 'memory_limit_exceeded', 'runtime_error', 'compile_error', 'system_error'].includes(msg.status)) {
              leaveSubmissionRoom(s.id);
              setTimeout(() => loadSubmission(), 1500);
            }
          };
        }
      } catch (err) {
        document.getElementById('content').innerHTML = `<p class="text-red-500 text-center">${escapeHtml(err.message) || '加载提交详情失败'}</p>`;
      }
    }

    let diffData = null;

    async function loadDiff() {
      try {
        diffData = await apiCall('GET', `/submissions/${sid}/diff`);
        if (diffData.prev_code !== null && diffData.prev_code !== undefined) {
          const btn = document.getElementById('diffBtn');
          if (btn) btn.classList.remove('hidden');
          const prevIdEl = document.getElementById('diffPrevId');
          if (prevIdEl) prevIdEl.textContent = diffData.prev_id;
        }
        if (diffData.expected_output !== undefined && diffData.expected_output !== null) {
          const sec = document.getElementById('waDiffSection');
          if (sec) sec.classList.remove('hidden');
        }
      } catch (err) { console.error('loadDiff error:', err); }
    }

    function renderLineDiff(prevText, currText) {
      if (typeof Diff === 'undefined') return '<div class="p-4 text-sm text-gray-500">diff 库加载失败</div>';
      const diff = Diff.diffLines(prevText || '', currText || '');
      let html = '';
      let oldLine = 1, newLine = 1;
      for (const part of diff) {
        const lines = part.value.split('\n');
        if (lines[lines.length - 1] === '') lines.pop();
        for (const line of lines) {
          if (part.added) {
            html += `<div class="diff-line diff-line-add"><span class="diff-lineno">${newLine}</span><span class="diff-lineno">-</span><span>+ ${escapeHtml(line)}</span></div>`;
            newLine++;
          } else if (part.removed) {
            html += `<div class="diff-line diff-line-del"><span class="diff-lineno">${oldLine}</span><span class="diff-lineno">-</span><span>- ${escapeHtml(line)}</span></div>`;
            oldLine++;
          } else {
            html += `<div class="diff-line diff-line-ctx"><span class="diff-lineno">${oldLine}</span><span class="diff-lineno">${newLine}</span><span>  ${escapeHtml(line)}</span></div>`;
            oldLine++;
            newLine++;
          }
        }
      }
      return html || '<div class="p-4 text-sm text-gray-500">无差异</div>';
    }

    function toggleCodeDiff() {
      const panel = document.getElementById('codeDiffPanel');
      if (!panel) return;
      if (panel.classList.contains('hidden')) {
        const content = document.getElementById('codeDiffContent');
        if (content && diffData) {
          content.innerHTML = renderLineDiff(diffData.prev_code, diffData.curr_code);
        }
        panel.classList.remove('hidden');
      } else {
        panel.classList.add('hidden');
      }
    }

    function toggleWaDiff() {
      const panel = document.getElementById('waDiffPanel');
      if (!panel) return;
      if (panel.classList.contains('hidden')) {
        const content = document.getElementById('waDiffContent');
        if (content && diffData) {
          content.innerHTML = renderLineDiff(diffData.expected_output, diffData.actual_output);
        }
        panel.classList.remove('hidden');
      } else {
        panel.classList.add('hidden');
      }
    }

    async function rejudge(id) {
      if (!confirm('确定重新评测此提交？')) return;
      try {
        await apiCall('POST', `/submissions/${id}/rejudge`);
        alert('已加入重测队列');
        setTimeout(() => loadSubmission(), 2000);
      } catch (err) { alert(err.message); }
    }

    function copyCode(btn) {
      if (!currentSourceCode) return;
      navigator.clipboard.writeText(currentSourceCode).then(() => {
        const orig = btn.textContent;
        btn.textContent = '✓ 已复制';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    }

    loadSubmission();
  </script>
</body>
</html>
