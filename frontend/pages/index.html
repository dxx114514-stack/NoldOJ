<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WinOJ - 在线评测系统</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <script src="/js/api.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div id="nav"></div>
  <div id="announcementBanner"></div>
  <div class="max-w-7xl mx-auto px-4 py-12">
    <div class="text-center mb-16">
      <h1 class="text-5xl font-bold text-gray-900 dark:text-white mb-4">WinOJ</h1>
      <p class="text-xl text-gray-600 dark:text-gray-400 dark:text-gray-500 dark:text-gray-300 mb-8">Windows 在线评测系统</p>
      <div class="flex justify-center space-x-4">
        <a href="/pages/problems.html" class="px-8 py-3 bg-indigo-600 text-white rounded-xl text-lg font-semibold hover:bg-indigo-700 shadow-lg hover:shadow-xl transition-all">开始刷题</a>
        <a href="/pages/ide.html" class="px-8 py-3 bg-white dark:bg-gray-800 dark:bg-gray-800 dark:bg-gray-800 text-indigo-600 dark:text-indigo-400 border-2 border-indigo-600 dark:border-indigo-500 rounded-xl text-lg font-semibold hover:bg-indigo-50 dark:hover:bg-gray-700 transition-all">在线编程</a>
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <div class="bg-white dark:bg-gray-800 dark:bg-gray-800 dark:bg-gray-800 rounded-2xl p-8 shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 hover:shadow-md transition-shadow">
        <div class="w-12 h-12 bg-indigo-100 dark:bg-indigo-900/30 rounded-xl flex items-center justify-center mb-4">
          <svg class="w-6 h-6 text-indigo-600 dark:text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        </div>
        <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-2">多语言支持</h3>
        <p class="text-gray-600 dark:text-gray-400 dark:text-gray-500">支持 C、C++、Python、Java、JavaScript 等语言，可通过管理面板动态配置。</p>
      </div>
      <div class="bg-white dark:bg-gray-800 dark:bg-gray-800 dark:bg-gray-800 rounded-2xl p-8 shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 hover:shadow-md transition-shadow">
        <div class="w-12 h-12 bg-green-100 dark:bg-green-900/30 rounded-xl flex items-center justify-center mb-4">
          <svg class="w-6 h-6 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        </div>
        <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-2">安全沙箱</h3>
        <p class="text-gray-600 dark:text-gray-400 dark:text-gray-500">Windows 沙箱隔离，CPU、内存、IO 限制，确保代码安全运行。</p>
      </div>
      <div class="bg-white dark:bg-gray-800 dark:bg-gray-800 dark:bg-gray-800 rounded-2xl p-8 shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 hover:shadow-md transition-shadow">
        <div class="w-12 h-12 bg-purple-100 dark:bg-purple-900/30 rounded-xl flex items-center justify-center mb-4">
          <svg class="w-6 h-6 text-purple-600 dark:text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-2">在线 IDE</h3>
        <p class="text-gray-600 dark:text-gray-400 dark:text-gray-500">浏览器内代码编辑器，支持语法高亮，即时运行，自定义输入。</p>
      </div>
    </div>
    <div class="mt-16 grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
      <div class="bg-white dark:bg-gray-800 dark:bg-gray-800 dark:bg-gray-800 rounded-xl p-6 shadow-sm dark:shadow-gray-900/30" id="stat-problems"><div class="text-3xl font-bold text-indigo-600 dark:text-indigo-400">-</div><div class="text-gray-500 dark:text-gray-400 dark:text-gray-500 mt-1">题目</div></div>
      <div class="bg-white dark:bg-gray-800 dark:bg-gray-800 dark:bg-gray-800 rounded-xl p-6 shadow-sm dark:shadow-gray-900/30" id="stat-submissions"><div class="text-3xl font-bold text-green-600 dark:text-green-400">-</div><div class="text-gray-500 dark:text-gray-400 dark:text-gray-500 mt-1">提交</div></div>
      <div class="bg-white dark:bg-gray-800 dark:bg-gray-800 dark:bg-gray-800 rounded-xl p-6 shadow-sm dark:shadow-gray-900/30" id="stat-users"><div class="text-3xl font-bold text-purple-600 dark:text-purple-400">-</div><div class="text-gray-500 dark:text-gray-400 dark:text-gray-500 mt-1">用户</div></div>
      <div class="bg-white dark:bg-gray-800 dark:bg-gray-800 dark:bg-gray-800 rounded-xl p-6 shadow-sm dark:shadow-gray-900/30" id="stat-languages"><div class="text-3xl font-bold text-orange-600 dark:text-orange-400">-</div><div class="text-gray-500 dark:text-gray-400 dark:text-gray-500 mt-1">语言</div></div>
    </div>
    <div class="mt-16">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white">推荐题单</h2>
        <a href="/pages/problem-sets.html" class="text-sm text-indigo-600 dark:text-indigo-400 hover:underline">查看全部 →</a>
      </div>
      <div id="recommendSets" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </div>
  </div>
  <script>
    document.getElementById('nav').innerHTML = renderNav('home');
    async function loadStats() {
      try {
        const data = await apiCall('GET', '/stats');
        document.getElementById('stat-problems').querySelector('.text-3xl').textContent = data.problems;
        document.getElementById('stat-submissions').querySelector('.text-3xl').textContent = data.submissions;
        document.getElementById('stat-users').querySelector('.text-3xl').textContent = data.users;
        document.getElementById('stat-languages').querySelector('.text-3xl').textContent = data.languages;
      } catch {}
    }
    loadStats();
    async function loadRecommendSets() {
      try {
        const data = await apiCall('GET', '/problem-sets?page=1&size=3');
        const el = document.getElementById('recommendSets');
        if (!data.problem_sets || data.problem_sets.length === 0) {
          el.innerHTML = '<div class="col-span-3 text-center text-gray-400 py-8">暂无题单</div>';
          return;
        }
        el.innerHTML = data.problem_sets.map(ps => {
          const pct = ps.problem_count > 0 ? Math.round((ps.solved_count / ps.problem_count) * 100) : 0;
          return `
            <a href="/pages/problem-set.html?id=${ps.id}" class="block bg-white dark:bg-gray-800 dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-6 hover:shadow-md hover:border-indigo-300 dark:hover:border-indigo-600 transition-all">
              <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-2">${escapeHtml(ps.title)}</h3>
              <p class="text-sm text-gray-600 dark:text-gray-400 dark:text-gray-500 line-clamp-2 mb-4 min-h-[2.5rem]">${escapeHtml(ps.description || '暂无描述')}</p>
              <div class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-400 dark:text-gray-500 mb-2">
                <span>${ps.problem_count} 题</span>
                <span>已做 ${ps.solved_count || 0}</span>
              </div>
              <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2 overflow-hidden">
                <div class="bg-indigo-600 dark:bg-indigo-400 h-2 rounded-full" style="width:${pct}%"></div>
              </div>
            </a>
          `;
        }).join('');
      } catch {}
    }
    loadRecommendSets();
    async function loadAnnouncementBanner() {
      try {
        const data = await apiCall('GET', '/announcements?type=global&page=1&size=1');
        const ann = data.announcements && data.announcements[0];
        if (!ann) return;
        if (localStorage.getItem('winoj_ann_closed_' + ann.id) === '1') return;
        document.getElementById('announcementBanner').innerHTML = `
          <div class="bg-indigo-600 text-white">
            <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
              <a href="/pages/announcements.html" class="flex items-center space-x-3 min-w-0 flex-1">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/></svg>
                <span class="font-semibold truncate">${escapeHtml(ann.title)}</span>
              </a>
              <button onclick="closeAnnouncementBanner(${ann.id})" class="p-1 rounded hover:bg-indigo-500 flex-shrink-0" title="关闭">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>
          </div>`;
      } catch {}
    }
    function closeAnnouncementBanner(id) {
      localStorage.setItem('winoj_ann_closed_' + id, '1');
      document.getElementById('announcementBanner').innerHTML = '';
    }
    loadAnnouncementBanner();
  </script>
</body>
</html>
