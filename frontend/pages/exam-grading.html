<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>批改试卷 - NoldOJ</title>
  <script src="/js/tailwind.js"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <script src="/js/api.js"></script>
  <script src="/js/markdown.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div id="nav"></div>
  <div class="max-w-4xl mx-auto px-4 py-8">
    <div id="content" class="text-center py-12 text-gray-400">加载中...</div>
  </div>
  <script>
    document.getElementById('nav').innerHTML = renderNav('exams');
    const params = new URLSearchParams(window.location.search);
    const eid = params.get('id');
    const sid = params.get('sid');
    let submission = null;
    let gradingScores = {};

    async function loadSubmission() {
      if (!eid || !sid) { document.getElementById('content').innerHTML = '<p class="text-red-500">参数错误</p>'; return; }
      try {
        const data = await apiCall('GET', `/exams/${eid}/submission/${sid}`);
        submission = data;
        renderGrading(data);
      } catch (err) {
        document.getElementById('content').innerHTML = `<p class="text-red-500">${escapeHtml(err.message) || '加载失败'}</p>`;
      }
    }

    function renderGrading(sub) {
      const answers = sub.answers || [];
      let html = `
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-6 mb-6">
          <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">📊 ${escapeHtml(sub.exam_title)} - 批改</h1>
          <div class="flex items-center gap-6 mt-4">
            <div class="text-center">
              <div class="text-3xl font-bold text-indigo-600 dark:text-indigo-400">${sub.total_score}</div>
              <div class="text-sm text-gray-500">当前得分</div>
            </div>
            <div class="text-center">
              <div class="text-3xl font-bold text-gray-600 dark:text-gray-400">${sub.max_score || sub.exam_total_score}</div>
              <div class="text-sm text-gray-500">满分</div>
            </div>
          </div>
          <div class="mt-4 text-sm text-gray-500">
            状态: <span class="${sub.status === 'graded' ? 'text-green-600' : 'text-yellow-600'}">${sub.status === 'graded' ? '已批改' : '待批改'}</span>
            ${sub.status === 'grading' ? `
            <button onclick="aiGrade()" class="ml-4 px-4 py-1.5 bg-purple-600 text-white text-sm rounded-lg hover:bg-purple-700">🤖 AI 批改</button>
            ` : ''}
          </div>
        </div>
      `;

      answers.forEach((a, i) => {
        const options = JSON.parse(a.options || '[]');
        const isSubjective = a.is_subjective === 1;
        const isCorrect = a.is_correct === 1;

        html += `
          <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border ${isSubjective ? 'border-yellow-300 dark:border-yellow-700' : isCorrect ? 'border-green-300 dark:border-green-700' : 'border-red-300 dark:border-red-700'} p-6 mb-4">
            <div class="flex items-start gap-3 mb-4">
              <span class="flex-shrink-0 w-8 h-8 rounded-full ${isCorrect ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'} flex items-center justify-center font-bold text-sm">${i + 1}</span>
              <div class="flex-1">
                <div class="font-medium text-gray-900 dark:text-white">${escapeHtml(a.question_title)}</div>
                <div class="text-xs text-gray-400 mt-1">
                  ${a.question_type === 'choice' ? '选择题' : a.question_type === 'true_false' ? '判断题' : a.question_type === 'fill_blank' ? '填空题' : '大题'}
                  · ${a.max_score} 分
                  ${isSubjective ? '· 主观题' : '· 客观题'}
                </div>
              </div>
              <div class="text-right">
                <div class="text-lg font-bold ${isCorrect ? 'text-green-600' : 'text-red-600'}">${a.score}/${a.max_score}</div>
              </div>
            </div>

            ${!isSubjective && a.correct_answer ? `
            <div class="mb-3 p-3 bg-green-50 dark:bg-green-900/20 rounded-xl">
              <div class="text-xs text-green-600 dark:text-green-400 font-medium">正确答案</div>
              <div class="text-sm text-gray-700 dark:text-gray-300 mt-1">${escapeHtml(a.correct_answer)}</div>
            </div>
            ` : ''}

            <div class="mb-3 p-3 bg-gray-50 dark:bg-gray-700 rounded-xl">
              <div class="text-xs text-gray-500 dark:text-gray-400 font-medium">学生答案</div>
              <div class="text-sm text-gray-700 dark:text-gray-300 mt-1 whitespace-pre-wrap">${escapeHtml(a.answer || '(未作答)')}</div>
            </div>

            ${isSubjective ? `
            <div class="mt-4">
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">评分 (${a.max_score} 分满分)</label>
              <div class="flex items-center gap-4">
                <input type="number" id="score-${a.id}" min="0" max="${a.max_score}" value="${a.score || 0}"
                  class="w-24 px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white"
                  onchange="gradingScores[${a.id}] = { score: this.value }">
                <span class="text-sm text-gray-500">/ ${a.max_score}</span>
              </div>
              <textarea id="comment-${a.id}" placeholder="评语（可选）" rows="2"
                class="mt-2 w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-700 dark:text-white text-sm"
                onchange="if(!gradingScores[${a.id}]) gradingScores[${a.id}] = {}; gradingScores[${a.id}].comment = this.value"></textarea>
            </div>
            ` : ''}

            ${a.ai_comment ? `
            <div class="mt-3 p-3 bg-purple-50 dark:bg-purple-900/20 rounded-xl">
              <div class="text-xs text-purple-600 dark:text-purple-400 font-medium">🤖 AI 评语</div>
              <div class="text-sm text-gray-700 dark:text-gray-300 mt-1">${escapeHtml(a.ai_comment)}</div>
            </div>
            ` : ''}

            ${a.human_comment ? `
            <div class="mt-3 p-3 bg-blue-50 dark:bg-blue-900/20 rounded-xl">
              <div class="text-xs text-blue-600 dark:text-blue-400 font-medium">👨‍🏫 教师评语</div>
              <div class="text-sm text-gray-700 dark:text-gray-300 mt-1">${escapeHtml(a.human_comment)}</div>
            </div>
            ` : ''}
          </div>
        `;
      });

      // 批改按钮
      const subjectiveCount = answers.filter(a => a.is_subjective === 1).length;
      if (subjectiveCount > 0) {
        html += `
        <div class="mt-6 flex justify-end gap-4">
          <button onclick="aiGrade()" class="px-6 py-2.5 bg-purple-600 text-white rounded-xl font-semibold hover:bg-purple-700 transition">
            🤖 AI 批改全部主观题
          </button>
          <button onclick="saveGrading()" class="px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition">
            💾 保存评分
          </button>
        </div>
        `;
      }

      document.getElementById('content').innerHTML = html;
    }

    async function aiGrade() {
      if (!confirm('确定使用 AI 批改所有主观题？')) return;
      try {
        const result = await apiCall('POST', `/exams/${eid}/ai-grade/${sid}`);
        alert(`AI 批改完成！总分: ${result.total_score}`);
        window.location.reload();
      } catch (err) {
        alert(err.message || 'AI 批改失败');
      }
    }

    async function saveGrading() {
      const answersArray = Object.entries(gradingScores).map(([answer_id, data]) => ({
        answer_id: parseInt(answer_id),
        score: parseInt(data.score) || 0,
        comment: data.comment || ''
      }));

      if (answersArray.length === 0) {
        alert('没有需要保存的评分');
        return;
      }

      try {
        const result = await apiCall('POST', `/exams/${eid}/grade/${sid}`, { answers: answersArray });
        alert(`评分保存成功！总分: ${result.total_score}`);
        window.location.reload();
      } catch (err) {
        alert(err.message || '保存失败');
      }
    }

    loadSubmission();
  </script>
</body>
</html>
