<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>比赛详情 - NoldOJ</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/js/tailwind.js"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <script src="/js/api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js" integrity="sha384-ZuC+DIACqSIZTsp+7YF57cR5Y+6qXa7YFbEKdA/EHA/R0T+41dtorqucYl71Zp+t" crossorigin="anonymous"></script>
  <script src="/js/markdown.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div id="nav"></div>
  <div class="max-w-5xl mx-auto px-4 py-8">
    <div id="content" class="text-center py-12 text-gray-400 dark:text-gray-500 dark:text-gray-400">加载中...</div>
  </div>
  <script>
    document.getElementById('nav').innerHTML = renderNav('contests');
    const params = new URLSearchParams(window.location.search);
    const cid = params.get('id');

    async function loadContest() {
      if (!cid) { document.getElementById('content').innerHTML = '<p class="text-red-500">未指定比赛 ID</p>'; return; }
      try {
        const c = await apiCall('GET', `/contests/${cid}`);
        document.title = `${c.title} - NoldOJ`;

        const now = new Date();
        const start = new Date(c.start_time);
        const end = new Date(c.end_time);
        let status = '未开始', statusColor = 'bg-blue-50 text-blue-700';
        if (now >= start && now <= end) { status = '进行中'; statusColor = 'bg-green-50 text-green-700'; }
        else if (now > end) { status = '已结束'; statusColor = 'bg-gray-100 text-gray-600'; }

        let problemsHtml = '';
        if (c.problems && c.problems.length > 0) {
          problemsHtml = `
            <div class="mt-6">
              <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-3">题目列表</h3>
              <div class="space-y-2">
                ${c.problems.map((p, i) => `
                  <div class="flex items-center justify-between p-3 bg-gray-50 dark:bg-gray-700 rounded-xl">
                    <div class="flex items-center space-x-3">
                      <span class="text-sm font-mono text-gray-500 dark:text-gray-400 dark:text-gray-500">${p.alias || '#' + p.id}</span>
                      <a href="/pages/problem.html?id=${p.id}" class="text-sm font-medium text-indigo-600 dark:text-indigo-400 hover:text-indigo-800">${escapeHtml(p.title)}</a>
                    </div>
                    <div class="flex items-center space-x-3 text-xs text-gray-400 dark:text-gray-500 dark:text-gray-400">
                      <span>时限: ${p.time_limit}ms</span>
                      <span>内存: ${p.memory_limit}MB</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }

        let leaderboardHtml = '';
        try {
          const lb = await apiCall('GET', `/contests/${cid}/leaderboard`);
          if (lb.leaderboard.length > 0) {
            const frozenBanner = lb.frozen
              ? `<div class="bg-yellow-100 dark:bg-yellow-900/40 border-l-4 border-yellow-500 text-yellow-800 dark:text-yellow-200 px-4 py-3 rounded-xl mb-3 text-sm font-medium">🔒 排行榜已冻结，最终排名赛后公布</div>`
              : '';
            leaderboardHtml = `
              <div id="contest-tab-leaderboard" class="mt-6">
                ${frozenBanner}
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 overflow-x-auto">
                  <table class="w-full">
                    <thead class="bg-gray-50 dark:bg-gray-700 border-b border-gray-200 dark:border-gray-700">
                      <tr>
                        <th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 dark:text-gray-400 dark:text-gray-500 uppercase">排名</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 dark:text-gray-500 uppercase">用户</th>
                        ${lb.problem_ids.map(pid => `<th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 dark:text-gray-400 dark:text-gray-500 uppercase">#${pid}</th>`).join('')}
                        <th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 dark:text-gray-400 dark:text-gray-500 uppercase">总分</th>
                        <th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 dark:text-gray-400 dark:text-gray-500 uppercase">总耗时</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 dark:divide-gray-700">
                      ${lb.leaderboard.map(u => `
                        <tr class="hover:bg-gray-50 dark:hover:bg-gray-700 dark:bg-gray-700">
                          <td class="px-4 py-3 text-center">
                            ${u.rank <= 3 ? `<span class="inline-block w-7 h-7 rounded-full text-center leading-7 text-sm font-bold ${u.rank===1?'bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-300':u.rank===2?'bg-gray-200 text-gray-600 dark:text-gray-400 dark:text-gray-500':'bg-orange-100 dark:bg-orange-900/30 text-orange-700 dark:text-orange-300'}">${u.rank}</span>` : `<span class="text-sm text-gray-500 dark:text-gray-400 dark:text-gray-500">${u.rank}</span>`}
                          </td>
                          <td class="px-4 py-3 text-sm font-medium"><a href="profile.html?id=${u.user_id}" class="text-gray-900 dark:text-white hover:text-indigo-600 dark:hover:text-indigo-400 hover:underline">${escapeHtml(u.nickname || u.username)}</a></td>
                          ${lb.problem_ids.map(pid => {
                            const p = u.problems[pid];
                            return `<td class="px-4 py-3 text-center text-sm">${p ? (p.status==='accepted'?`<span class="text-green-600 dark:text-green-400">${p.score}</span>`:`<span class="text-red-400">X</span>`) : '<span class="text-gray-300">-</span>'}</td>`;
                          }).join('')}
                          <td class="px-4 py-3 text-center text-sm font-bold text-gray-900 dark:text-white">${u.total_score}</td>
                          <td class="px-4 py-3 text-center text-sm text-gray-500 dark:text-gray-400 dark:text-gray-500">${u.total_time}ms</td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              </div>
            `;
          }
        } catch {}

        let announcementsHtml = `
          <div id="contest-tab-announcements" class="hidden mt-6">
            <p class="text-gray-400 text-center py-8">加载中...</p>
          </div>
        `;

        const tabBtns = `
          <div class="flex space-x-2 mt-6 border-b border-gray-200 dark:border-gray-700">
            <button onclick="switchContestTab('problems')" id="ctab-problems" class="px-4 py-2 text-sm font-medium text-indigo-600 dark:text-indigo-400 border-b-2 border-indigo-600 dark:border-indigo-400">题目</button>
            ${leaderboardHtml ? `<button onclick="switchContestTab('leaderboard')" id="ctab-leaderboard" class="px-4 py-2 text-sm font-medium text-gray-500 dark:text-gray-400 border-b-2 border-transparent hover:text-gray-700">排行榜</button>` : ''}
            <button onclick="switchContestTab('announcements')" id="ctab-announcements" class="px-4 py-2 text-sm font-medium text-gray-500 dark:text-gray-400 border-b-2 border-transparent hover:text-gray-700">公告</button>
          </div>
        `;

        // 功能9：已结束比赛显示"虚拟参加"按钮
        const ended = new Date(c.end_time).getTime() < Date.now();
        const virtualBtn = ended
          ? `<button onclick="startVirtual(${c.id})" class="ml-3 px-4 py-1.5 bg-purple-600 text-white text-sm rounded-lg hover:bg-purple-700 font-semibold">⏱ 虚拟参加</button>`
          : '';
        const myVirtualLink = ended
          ? `<a href="/pages/my-virtual-contests.html" class="ml-2 text-sm text-purple-600 dark:text-purple-400 hover:underline">我的虚拟比赛</a>`
          : '';

        document.getElementById('content').innerHTML = `
          <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-8">
            <div class="flex items-start justify-between mb-4">
              <div>
                <h1 class="text-3xl font-bold text-gray-900 dark:text-white">${escapeHtml(c.title)}</h1>
                <p class="text-gray-500 dark:text-gray-400 dark:text-gray-500 mt-2">${escapeHtml(c.description || '暂无描述')}</p>
              </div>
              <span class="px-3 py-1 text-xs rounded-full font-medium ${statusColor}">${status}</span>
              ${virtualBtn}${myVirtualLink}
            </div>
            <div class="flex items-center space-x-6 text-sm text-gray-500 dark:text-gray-400 dark:text-gray-500 mb-4">
              <span>题目: ${c.problems?.length || 0} 道</span>
              <span>参赛: ${c.participant_count || 0} 人</span>
              <span>${new Date(c.start_time).toLocaleString()} ~ ${new Date(c.end_time).toLocaleString()}</span>
            </div>
            ${tabBtns}
            <div id="contest-tab-problems" class="mt-6">${problemsHtml ? problemsHtml.replace(/<div class="mt-6">/, '<div>') : '<p class="text-gray-400 text-center py-8">暂无题目</p>'}</div>
            ${leaderboardHtml}
            ${announcementsHtml}
          </div>
        `;
      } catch (err) {
        document.getElementById('content').innerHTML = `<p class="text-red-500 text-center">${escapeHtml(err.message) || '加载比赛失败'}</p>`;
      }
    }

    function switchContestTab(tab) {
      ['problems','leaderboard','announcements'].forEach(t => {
        const el = document.getElementById(`contest-tab-${t}`);
        if (el) el.classList.toggle('hidden', t !== tab);
        const btn = document.getElementById(`ctab-${t}`);
        if (btn) {
          const active = t === tab;
          btn.className = `px-4 py-2 text-sm font-medium border-b-2 ${active ? 'text-indigo-600 dark:text-indigo-400 border-indigo-600 dark:border-indigo-400' : 'text-gray-500 dark:text-gray-400 border-transparent hover:text-gray-700'}`;
        }
      });
      if (tab === 'announcements') loadContestAnnouncements();
    }

    async function loadContestAnnouncements() {
      const el = document.getElementById('contest-tab-announcements');
      try {
        const data = await apiCall('GET', `/contests/${cid}/announcements`);
        if (!data.announcements || data.announcements.length === 0) {
          el.innerHTML = '<p class="text-gray-400 text-center py-8">暂无比赛公告</p>';
          return;
        }
        el.innerHTML = data.announcements.map(a => `
          <div class="bg-gray-50 dark:bg-gray-700 rounded-xl p-4 mb-3">
            <div class="flex items-center gap-2 flex-wrap mb-2">
              ${a.pinned ? '<span class="px-1.5 py-0.5 text-xs rounded bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300">置顶</span>' : ''}
              <h4 class="font-semibold text-gray-900 dark:text-white">${escapeHtml(a.title)}</h4>
            </div>
            <div class="text-sm text-gray-600 dark:text-gray-300">${renderMarkdown(a.content)}</div>
            <p class="text-xs text-gray-400 mt-2">${escapeHtml(a.nickname || a.username || '')} · ${new Date(a.created_at).toLocaleString()}</p>
          </div>
        `).join('');
        renderMathDefaults(el);
      } catch (err) {
        el.innerHTML = `<p class="text-red-500 text-center py-8">${escapeHtml(err.message) || '加载公告失败'}</p>`;
      }
    }

    // Socket.io 实时排行榜更新
    function onContestRankingUpdate(msg) {
      if (msg.contest_id !== parseInt(cid)) return;
      // 高亮闪烁后刷新排行榜
      const lbTab = document.getElementById('contest-tab-leaderboard');
      if (lbTab) {
        lbTab.style.transition = 'background-color 1s';
        lbTab.style.backgroundColor = '#fef3c7';
        setTimeout(() => { lbTab.style.backgroundColor = ''; }, 1000);
        // 局部刷新排行榜数据
        refreshLeaderboard();
      }
    }
    window.onContestRankingUpdate = onContestRankingUpdate;

    async function refreshLeaderboard() {
      try {
        const lb = await apiCall('GET', `/contests/${cid}/leaderboard`);
        const tbody = document.querySelector('#contest-tab-leaderboard tbody');
        if (!tbody || !lb.leaderboard) return;
        tbody.innerHTML = lb.leaderboard.map(u => `
          <tr class="hover:bg-gray-50 dark:hover:bg-gray-700 dark:bg-gray-700">
            <td class="px-4 py-3 text-center">
              ${u.rank <= 3 ? `<span class="inline-block w-7 h-7 rounded-full text-center leading-7 text-sm font-bold ${u.rank===1?'bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-300':u.rank===2?'bg-gray-200 text-gray-600 dark:text-gray-400 dark:text-gray-500':'bg-orange-100 dark:bg-orange-900/30 text-orange-700 dark:text-orange-300'}">${u.rank}</span>` : `<span class="text-sm text-gray-500 dark:text-gray-400 dark:text-gray-500">${u.rank}</span>`}
            </td>
            <td class="px-4 py-3 text-sm font-medium"><a href="profile.html?id=${u.user_id}" class="text-gray-900 dark:text-white hover:text-indigo-600 dark:hover:text-indigo-400 hover:underline">${escapeHtml(u.nickname || u.username)}</a></td>
            ${lb.problem_ids.map(pid => {
              const p = u.problems[pid];
              return `<td class="px-4 py-3 text-center text-sm">${p ? (p.status==='accepted'?`<span class="text-green-600 dark:text-green-400">${p.score}</span>`:`<span class="text-red-400">X</span>`) : '<span class="text-gray-300">-</span>'}</td>`;
            }).join('')}
            <td class="px-4 py-3 text-center text-sm font-bold text-gray-900 dark:text-white">${u.total_score}</td>
            <td class="px-4 py-3 text-center text-sm text-gray-500 dark:text-gray-400 dark:text-gray-500">${u.total_time}ms</td>
          </tr>
        `).join('');
      } catch {}
    }

    loadContest();
    // 加入比赛排行榜房间
    setTimeout(() => { joinContestRankingRoom(parseInt(cid)); }, 1000);

    // 功能9：发起虚拟参加
    async function startVirtual(contestId) {
      try {
        const contest = await apiCall('GET', `/contests/${contestId}`);
        const start = new Date(contest.start_time);
        const end = new Date(contest.end_time);
        const durMin = Math.round((end - start) / 60000);
        const hours = Math.floor(durMin / 60);
        const mins = durMin % 60;
        const durText = hours > 0 ? `${hours} 小时${mins > 0 ? mins + ' 分钟' : ''}` : `${durMin} 分钟`;
        if (!confirm(`将开始虚拟比赛。\n时长: ${durText}\n开始后不可暂停，服务端时间为准。\n确定开始？`)) return;
        const vc = await apiCall('POST', `/contests/${contestId}/virtual-start`);
        window.location.href = `/pages/virtual-contest.html?id=${vc.id}`;
      } catch (err) {
        if (err.virtual_contest_id) {
          if (confirm('你已经虚拟参加过此比赛，是否前往查看？')) {
            window.location.href = `/pages/virtual-contest.html?id=${err.virtual_contest_id}`;
          }
        } else {
          alert(err.message || '启动失败');
        }
      }
    }
  </script>
</body>
</html>
