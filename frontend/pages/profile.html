<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人资料 - NoldOJ</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/js/tailwind.js"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <link rel="stylesheet" href="/js/katex/katex.min.css">
  <script src="/js/katex/katex.min.js"></script>
  <script src="/js/katex/auto-render.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/purify.min.js"></script>
  <script src="/js/markdown.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div id="nav"></div>
  <div class="max-w-3xl mx-auto px-4 py-8">
    <h1 id="pageTitle" class="text-2xl font-bold text-gray-900 dark:text-white mb-6">个人资料</h1>
    <div id="profile" class="text-center py-8 text-gray-400 dark:text-gray-500 dark:text-gray-400">加载中...</div>
  </div>
  <script>
    document.getElementById('nav').innerHTML = renderNav('');
    const urlParams = new URLSearchParams(window.location.search);
    const viewUserId = urlParams.get('id');
    const currentUser = getUser();
    const isSelf = !viewUserId || (currentUser && String(currentUser.id) === String(viewUserId));
    let currentProfile = null;

    // 是否 admin/su
    function isPrivileged(user) {
      return user && (user.role === 'admin' || user.role === 'su');
    }
    // 该用户某项隐私数据当前访问者是否可见
    function canViewField(hidden) {
      if (isSelf || isPrivileged(currentUser)) return true;
      return !hidden;
    }

    document.getElementById('pageTitle').textContent = isSelf ? '个人资料' : '用户资料';

    async function loadProfile() {
      try {
        let u;
        if (isSelf) {
          u = await apiCall('GET', '/users/me');
        } else {
          u = await apiCall('GET', `/users/${viewUserId}/profile`);
        }
        currentProfile = u;

        document.getElementById('profile').innerHTML = `
          <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-6">
            <div class="flex items-center space-x-4 mb-6">
              <div class="w-16 h-16 rounded-full bg-indigo-100 dark:bg-indigo-900/30 flex items-center justify-center">
                <span class="text-2xl font-bold text-indigo-600 dark:text-indigo-400">${escapeHtml((u.nickname || u.username || 'U')[0].toUpperCase())}</span>
              </div>
              <div>
                <h2 class="text-xl font-bold text-gray-900 dark:text-white">${escapeHtml(u.nickname || u.username)}</h2>
                <div class="flex items-center space-x-2 mt-1">
                  <span class="text-sm text-gray-500 dark:text-gray-400 dark:text-gray-500">@${escapeHtml(u.username)}</span>
                  ${roleBadge(u.role)}
                  <span class="px-2 py-0.5 text-xs rounded-full bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-300">Rating: ${u.rating || 1500}</span>
                </div>
              </div>
            </div>

            ${(u.signature || '').trim() ? `<div class="mb-4 p-3 bg-gray-50 dark:bg-gray-700 rounded-xl text-sm text-gray-600 dark:text-gray-400 italic border-l-4 border-indigo-300">"${escapeHtml(u.signature)}"</div>` : ''}

            ${(u.bio || '').trim() ? `<div class="mb-6"><div class="flex items-center justify-between mb-2"><h3 class="text-sm font-semibold text-gray-700 dark:text-gray-300">个人简介</h3><button onclick="copyBioMarkdown(this)" class="text-xs text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 dark:hover:text-indigo-300">📋 复制 Markdown</button></div><div id="bioContent">${renderMarkdown(u.bio)}</div></div>` : ''}

            <div class="text-sm text-gray-400 dark:text-gray-500 dark:text-gray-400">注册时间: ${new Date(u.created_at).toLocaleDateString()}</div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-6 pt-4 border-t border-gray-100 dark:border-gray-700">
              ${canViewField(u.hide_achievements) ? `
              <a href="/pages/achievements.html?user_id=${encodeURIComponent(u.id)}" class="flex flex-col items-center gap-1 rounded-xl border border-gray-200 dark:border-gray-600 p-3 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition">
                <span class="text-2xl">🏆</span>
                <span class="text-sm text-gray-700 dark:text-gray-300">成就</span>
              </a>` : `
              <div class="flex flex-col items-center gap-1 rounded-xl border border-gray-200 dark:border-gray-600 p-3 opacity-50 cursor-not-allowed" title="该用户已对其它用户隐藏成就">
                <span class="text-2xl">🏆</span>
                <span class="text-sm text-gray-400 dark:text-gray-500">成就</span>
              </div>`}
              ${canViewField(u.hide_dashboard) ? `
              <a href="/pages/dashboard.html?user_id=${encodeURIComponent(u.id)}" class="flex flex-col items-center gap-1 rounded-xl border border-gray-200 dark:border-gray-600 p-3 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition">
                <span class="text-2xl">📊</span>
                <span class="text-sm text-gray-700 dark:text-gray-300">看板</span>
              </a>` : `
              <div class="flex flex-col items-center gap-1 rounded-xl border border-gray-200 dark:border-gray-600 p-3 opacity-50 cursor-not-allowed" title="该用户已对其它用户隐藏看板">
                <span class="text-2xl">📊</span>
                <span class="text-sm text-gray-400 dark:text-gray-500">看板</span>
              </div>`}
              ${canViewField(u.hide_favorites) ? `
              <a href="/pages/favorites.html?user_id=${encodeURIComponent(u.id)}" class="flex flex-col items-center gap-1 rounded-xl border border-gray-200 dark:border-gray-600 p-3 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition">
                <span class="text-2xl">⭐</span>
                <span class="text-sm text-gray-700 dark:text-gray-300">收藏</span>
              </a>` : `
              <div class="flex flex-col items-center gap-1 rounded-xl border border-gray-200 dark:border-gray-600 p-3 opacity-50 cursor-not-allowed" title="该用户已对其它用户隐藏收藏">
                <span class="text-2xl">⭐</span>
                <span class="text-sm text-gray-400 dark:text-gray-500">收藏</span>
              </div>`}
            </div>
          </div>
          ${isSelf ? `
          <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-6 mt-4">
            <h3 class="font-semibold text-gray-900 dark:text-white mb-4">编辑资料</h3>
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">昵称</label>
                <input id="edNickname" value="${escapeHtml(u.nickname || '')}" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-800 dark:text-white">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">个性签名 <span class="text-xs text-gray-400 dark:text-gray-500 dark:text-gray-400">（最多1000字，支持 D("内容") 动态签名）</span></label>
                <textarea id="edSignature" rows="2" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl font-mono text-sm text-left focus:ring-2 focus:ring-indigo-500 outline-none resize-none dark:bg-gray-800 dark:text-white">${escapeHtml(u.signature || '')}</textarea>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">个人简介 <span class="text-xs text-gray-400 dark:text-gray-500 dark:text-gray-400">（支持 Markdown 和 KaTeX 公式）</span></label>
                <textarea id="edBio" rows="6" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl font-mono text-sm text-left focus:ring-2 focus:ring-indigo-500 outline-none resize-none dark:bg-gray-800 dark:text-white" placeholder="# 关于我&#10;&#10;支持 **Markdown** 和 $E=mc^2$ 公式">${escapeHtml(u.bio || '')}</textarea>
              </div>
              <div class="flex items-center space-x-2">
                <input type="checkbox" id="edHideRating" class="rounded text-indigo-600 dark:text-indigo-400" ${u.hide_rating ? 'checked' : ''}>
                <label for="edHideRating" class="text-sm text-gray-700 dark:text-gray-300">隐藏 Rating 排行榜</label>
              </div>
              <div class="border-t border-gray-100 dark:border-gray-700 pt-3 mt-2">
                <p class="text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">隐私设置 <span class="text-xs text-gray-400 dark:text-gray-500 font-normal">对其它用户保密（管理员始终可见）</span></p>
                <div class="space-y-2">
                  <div class="flex items-center space-x-2">
                    <input type="checkbox" id="edHideAchievements" class="rounded text-indigo-600 dark:text-indigo-400" ${u.hide_achievements ? 'checked' : ''}>
                    <label for="edHideAchievements" class="text-sm text-gray-700 dark:text-gray-300">隐藏我的成就</label>
                  </div>
                  <div class="flex items-center space-x-2">
                    <input type="checkbox" id="edHideDashboard" class="rounded text-indigo-600 dark:text-indigo-400" ${u.hide_dashboard ? 'checked' : ''}>
                    <label for="edHideDashboard" class="text-sm text-gray-700 dark:text-gray-300">隐藏我的看板</label>
                  </div>
                  <div class="flex items-center space-x-2">
                    <input type="checkbox" id="edHideFavorites" class="rounded text-indigo-600 dark:text-indigo-400" ${u.hide_favorites ? 'checked' : ''}>
                    <label for="edHideFavorites" class="text-sm text-gray-700 dark:text-gray-300">隐藏我的收藏</label>
                  </div>
                </div>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">偏好语言</label>
                <select id="edPrefLang" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none dark:bg-gray-800 dark:text-white">
                  <option value="">不设置</option>
                  <option value="c">C</option>
                  <option value="cpp">C++</option>
                  <option value="python3">Python 3</option>
                  <option value="java">Java</option>
                  <option value="javascript">JavaScript</option>
                </select>
              </div>
              <div class="flex justify-end">
                <button onclick="saveProfile()" class="px-6 py-2 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700">保存</button>
              </div>
            </div>
          </div>
          ` : ''}
        `;
        if ((u.bio || '').trim()) {
          const bioEl = document.getElementById('bioContent');
          if (bioEl) renderMathDefaults(bioEl);
        }
        const prefLangSel = document.getElementById('edPrefLang');
        if (prefLangSel && u.preferred_language) prefLangSel.value = u.preferred_language;
      } catch (err) {
        document.getElementById('profile').innerHTML = `<p class="text-red-500 text-center">${escapeHtml(err.message) || '加载失败'}</p>`;
      }
    }

    async function saveProfile() {
      try {
        const prefLang = document.getElementById('edPrefLang').value;
        await apiCall('PUT', '/users/me', {
          nickname: document.getElementById('edNickname').value,
          signature: document.getElementById('edSignature').value,
          bio: document.getElementById('edBio').value,
          hide_rating: document.getElementById('edHideRating').checked,
          hide_achievements: document.getElementById('edHideAchievements').checked,
          hide_dashboard: document.getElementById('edHideDashboard').checked,
          hide_favorites: document.getElementById('edHideFavorites').checked,
          preferred_language: prefLang
        });
        const user = getUser();
        if (user) { user.preferred_language = prefLang; setUser(user); }
        alert('资料已保存');
        loadProfile();
      } catch (err) { alert(err.message); }
    }

    function copyBioMarkdown(btn) {
      if (!currentProfile || !currentProfile.bio) return;
      navigator.clipboard.writeText(currentProfile.bio).then(() => {
        const orig = btn.textContent;
        btn.textContent = '✓ 已复制';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    }

    loadProfile();
  </script>
</body>
</html>
