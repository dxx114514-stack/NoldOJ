<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提交 - WinOJ</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/js/tailwind.js"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" integrity="sha384-zaeBlB/vwYsDRSlFajnDd7OydJ0cWk+c2OWybl3eSUf6hW2EbhlCsQPqKr3gkznT" crossorigin="anonymous">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js" integrity="sha384-ZYmwuq4n2gOcNxMSiJ6jyTj+BbIrilr7p6dlq6q5nmSWKmsH9UU4K1qqjycMkfmR" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js" integrity="sha384-o9m634t2Hy35pPNKd9Xe16ntbSw11jCOuKPDrzQGXI8k87L2JZthaA3rwmJjnF7Z" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js" integrity="sha384-Xy+2exU6lBoT4OpUOtnQb+cUpn+nlJQEHvRobWVtwz6wIsw4oNoO7xyd/l8rYgMy" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js" integrity="sha384-g0o+WW9mdIxA7LaaCKTkRm0M5TVT+Bb4s9eocxPsI2G0Xm0POG9iD6G6qP1IIsfS" crossorigin="anonymous"></script>
  <script src="/js/api.js"></script>
  <style>.CodeMirror { height: 400px; border-radius: 0.75rem; font-size: 14px; text-align: left; }
  .CodeMirror-code { text-align: left !important; }
  .file-tab { cursor: pointer; user-select: none; }
  .file-tab.active { background: #6366f1; color: white; }
  .file-tab:not(.active) { background: #e5e7eb; color: #374151; }
  .dark .file-tab:not(.active) { background: #374151; color: #d1d5db; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div id="nav"></div>
  <div class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-6">提交代码</h1>
    <div id="error" class="hidden mb-4 p-4 bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300 rounded-xl text-sm"></div>
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-gray-900/30 border border-gray-100 dark:border-gray-700 p-6">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">题目</label>
        <div id="problemInfo" class="px-4 py-2.5 bg-gray-50 dark:bg-gray-700 rounded-xl text-gray-700 dark:text-gray-300">加载中...</div>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">语言</label>
        <select id="language" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none dark:bg-gray-800 dark:text-white" onchange="changeLang()">
        </select>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">源代码</label>
        <div id="fileTabsBar" class="flex items-center space-x-1 mb-2 flex-wrap"></div>
        <textarea id="sourceCode"></textarea>
      </div>
      <div class="flex justify-end">
        <button id="submitBtn" onclick="submitCode()" class="px-8 py-2.5 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition">提交</button>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('nav').innerHTML = renderNav('problems');
    const params = new URLSearchParams(window.location.search);
    const pid = params.get('id');
    const vcId = params.get('vc'); // 功能9：虚拟比赛提交时携带
    let editor;
    let problemData = null;

    const langModes = { c: 'text/x-csrc', cpp: 'text/x-c++src', python3: 'text/x-python', java: 'text/x-java', javascript: 'text/javascript' };
    const defaultFilenames = { c: 'main.c', cpp: 'main.cpp', python3: 'main.py', java: 'Main.java', javascript: 'main.js' };
    let fileTabs = [];
    let activeTabIndex = 0;

    function defaultFilename(lang) {
      return defaultFilenames[lang] || 'main.txt';
    }

    async function init() {
      editor = CodeMirror.fromTextArea(document.getElementById('sourceCode'), {
        lineNumbers: true, mode: 'text/x-csrc', theme: 'default', indentUnit: 4
      });
      try {
        const langs = await apiCall('GET', '/ide/languages');
        const sel = document.getElementById('language');
        sel.innerHTML = langs.map(l => `<option value="${l.name}">${l.display_name} (${l.extension})</option>`).join('');
        const user = getUser();
        if (user && user.preferred_language) {
          sel.value = user.preferred_language;
        }
      } catch {}
      // 初始化默认文件 tab
      const lang = document.getElementById('language').value || 'cpp';
      fileTabs = [{ filename: defaultFilename(lang), content: '' }];
      activeTabIndex = 0;
      renderTabs();
      editor.setOption('mode', langModes[lang] || 'text/plain');

      if (pid) {
        try {
          problemData = await apiCall('GET', `/problems/${pid}`);
          document.getElementById('problemInfo').innerHTML = `<span class="font-semibold">#${problemData.id}</span> ${escapeHtml(problemData.title)} <span class="text-sm text-gray-500 dark:text-gray-400 dark:text-gray-500 ml-2">时限: ${problemData.time_limit}ms | 内存: ${problemData.memory_limit}MB</span>`;
        } catch (err) {
          document.getElementById('problemInfo').innerHTML = '<span class="text-red-500">加载题目失败</span>';
        }
      } else {
        document.getElementById('problemInfo').innerHTML = '<span class="text-gray-500 dark:text-gray-400 dark:text-gray-500">未选择题目</span>';
      }
    }

    function renderTabs() {
      const bar = document.getElementById('fileTabsBar');
      bar.innerHTML = fileTabs.map((f, i) => `
        <div class="file-tab ${i === activeTabIndex ? 'active' : ''} px-3 py-1.5 rounded-t-lg text-sm font-medium flex items-center space-x-2" onclick="switchTab(${i})">
          <span ondblclick="event.stopPropagation();renameTab(${i})">${escapeHtml(f.filename)}</span>
          ${fileTabs.length > 1 ? `<button onclick="event.stopPropagation();removeTab(${i})" class="text-xs hover:text-red-500" title="删除">×</button>` : ''}
        </div>
      `).join('') + `
        <button onclick="addTab()" class="px-3 py-1.5 text-sm font-medium text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 rounded-t-lg" title="添加文件">+ 添加</button>
      `;
    }

    function saveCurrentTab() {
      if (fileTabs[activeTabIndex]) {
        fileTabs[activeTabIndex].content = editor.getValue();
      }
    }

    function switchTab(i) {
      if (i < 0 || i >= fileTabs.length) return;
      saveCurrentTab();
      activeTabIndex = i;
      editor.setValue(fileTabs[i].content);
      renderTabs();
    }

    function addTab() {
      const lang = document.getElementById('language').value || 'cpp';
      const name = prompt('请输入文件名:', defaultFilename(lang).replace(/(\.\w+)$/, '_new$1'));
      if (!name) return;
      if (fileTabs.some(f => f.filename === name)) {
        alert('文件名已存在');
        return;
      }
      saveCurrentTab();
      fileTabs.push({ filename: name, content: '' });
      activeTabIndex = fileTabs.length - 1;
      editor.setValue('');
      renderTabs();
    }

    function removeTab(i) {
      if (fileTabs.length <= 1) { alert('至少保留一个文件'); return; }
      fileTabs.splice(i, 1);
      if (activeTabIndex >= fileTabs.length) activeTabIndex = fileTabs.length - 1;
      editor.setValue(fileTabs[activeTabIndex].content);
      renderTabs();
    }

    function renameTab(i) {
      const name = prompt('请输入新文件名:', fileTabs[i].filename);
      if (!name) return;
      if (fileTabs.some((f, idx) => idx !== i && f.filename === name)) {
        alert('文件名已存在');
        return;
      }
      fileTabs[i].filename = name;
      renderTabs();
    }

    function changeLang() {
      const lang = document.getElementById('language').value;
      editor.setOption('mode', langModes[lang] || 'text/plain');
      // 若当前只有一个空默认文件，跟随语言更新文件名
      if (fileTabs.length === 1 && fileTabs[0].content === '') {
        fileTabs[0].filename = defaultFilename(lang);
        renderTabs();
      }
    }

    async function submitCode() {
      if (!getToken()) { window.location.href = '/pages/login.html'; return; }
      const btn = document.getElementById('submitBtn');
      const errDiv = document.getElementById('error');
      btn.disabled = true; btn.textContent = '提交中...';
      errDiv.classList.add('hidden');
      try {
        saveCurrentTab();
        const files = fileTabs.map(f => ({ filename: f.filename, content: f.content }));
        const data = await apiCall('POST', '/submissions', {
          problem_id: parseInt(pid) || 0,
          language: document.getElementById('language').value,
          files: files,
          ...(vcId ? { virtual_contest_id: parseInt(vcId) } : {})
        });
        window.location.href = `/pages/submission.html?id=${data.submission_id}`;
      } catch (err) {
        errDiv.textContent = err.message || '提交失败';
        errDiv.classList.remove('hidden');
        btn.disabled = false; btn.textContent = '提交';
      }
    }
    init();
  </script>
</body>
</html>
