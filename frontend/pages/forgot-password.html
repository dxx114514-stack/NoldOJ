<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>找回密码 - WinOJ</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/js/tailwind.js"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <script src="/js/api.js"></script>
  <style>
    .captcha-svg svg { display: block; }
    .captcha-svg { background: #fff; border-radius: 0.5rem; }
    .dark .captcha-svg { border-color: #4b5563 !important; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">
  <div id="nav"></div>
  <div class="max-w-md mx-auto mt-16 px-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-8 border border-gray-100 dark:border-gray-700">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">忘记密码</h1>
        <p class="text-gray-500 dark:text-gray-400 mt-2">通过绑定邮箱重置你的登录密码</p>
      </div>
      <div id="error" class="hidden mb-4 px-4 py-3 border-2 border-red-400 bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300 rounded-xl text-sm font-medium"></div>
      <div id="success" class="hidden mb-4 px-4 py-3 border-2 border-green-400 bg-green-50 dark:bg-green-900/30 text-green-700 dark:text-green-300 rounded-xl text-sm font-medium"></div>
      <form onsubmit="handleReset(event)">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">用户名</label>
          <input id="username" type="text" required minlength="3" maxlength="32" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition dark:bg-gray-700 dark:text-white" placeholder="请输入用户名">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">绑定邮箱</label>
          <div class="flex space-x-2">
            <input id="email" type="email" required class="flex-1 px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition dark:bg-gray-700 dark:text-white" placeholder="your@email.com">
            <button type="button" id="sendCodeBtn" onclick="sendCode()" class="px-4 py-2.5 bg-indigo-100 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 rounded-xl text-sm font-medium hover:bg-indigo-200 dark:hover:bg-indigo-900/50 transition whitespace-nowrap">发送验证码</button>
          </div>
        </div>
        <div id="captchaSection" class="mb-4 hidden">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">图形验证码</label>
          <div class="flex space-x-2">
            <input id="captchaCode" type="text" minlength="4" maxlength="4" class="flex-1 px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition dark:bg-gray-700 dark:text-white uppercase" placeholder="请输入验证码">
            <div id="captchaImg" class="captcha-svg cursor-pointer border border-gray-300 dark:border-gray-600 rounded-xl overflow-hidden hover:opacity-80 transition flex items-center justify-center" title="点击刷新验证码" style="min-width:130px;"></div>
          </div>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">邮箱验证码</label>
          <div class="flex space-x-2">
            <input id="emailCode" type="text" maxlength="6" class="flex-1 px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition dark:bg-gray-700 dark:text-white" placeholder="6位验证码">
            <span id="emailStatus" class="flex items-center text-sm text-gray-400"></span>
          </div>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">新密码</label>
          <input id="newPassword" type="password" required minlength="8" class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition dark:bg-gray-700 dark:text-white" placeholder="至少 8 位，含字母与数字或符号">
        </div>
        <button type="submit" id="resetBtn" class="w-full py-2.5 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition">重置密码</button>
      </form>
      <p class="text-center mt-6 text-sm text-gray-500 dark:text-gray-400">想起来了？<a href="/pages/login.html" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 font-medium">返回登录</a></p>
    </div>
  </div>
  <script>
    document.getElementById('nav').innerHTML = renderNav('');
    let captchaId = '';
    let captchaEnabled = false;
    let codeTimer = null;

    loadCaptcha((s) => {
      captchaId = s.id;
      captchaEnabled = s.enabled;
    });

    async function sendCode() {
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const setStatus = (text, ok) => {
        const el = document.getElementById('emailStatus');
        el.textContent = text;
        el.className = 'flex items-center text-sm ' + (ok ? 'text-green-600' : 'text-red-500');
      };
      if (!username || !email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        setStatus('请输入有效的用户名和邮箱', false);
        return;
      }
      const btn = document.getElementById('sendCodeBtn');
      btn.disabled = true; btn.textContent = '发送中...';
      try {
        const body = { username, email };
        if (captchaEnabled) {
          body.captcha_id = captchaId;
          body.captcha_code = document.getElementById('captchaCode').value;
        }
        await apiCall('POST', '/auth/forgot-password', body);
        if (captchaEnabled) {
          loadCaptcha((s) => { captchaId = s.id; captchaEnabled = s.enabled; });
        }
        setStatus('已发送', true);
        let sec = 60;
        btn.textContent = `${sec}s`;
        codeTimer = setInterval(() => {
          sec--;
          if (sec <= 0) {
            clearInterval(codeTimer);
            btn.disabled = false; btn.textContent = '发送验证码';
          } else {
            btn.textContent = `${sec}s`;
          }
        }, 1000);
      } catch (err) {
        if (captchaEnabled) {
          document.getElementById('captchaCode').value = '';
          loadCaptcha((s) => { captchaId = s.id; captchaEnabled = s.enabled; });
        }
        setStatus(err.message || '发送失败', false);
        btn.disabled = false; btn.textContent = '发送验证码';
      }
    }

    async function handleReset(e) {
      e.preventDefault();
      const btn = document.getElementById('resetBtn');
      const okDiv = document.getElementById('success');
      btn.disabled = true; btn.textContent = '提交中...';
      hideError('error');
      okDiv.classList.add('hidden');
      try {
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const code = document.getElementById('emailCode').value.trim();
        const new_password = document.getElementById('newPassword').value;
        if (!code || new_password.length < 8) {
          throw new Error('请填写邮箱验证码，且新密码至少 8 位');
        }
        await apiCall('POST', '/auth/reset-password', { username, email, code, new_password });
        okDiv.textContent = '密码已重置，请使用新密码登录。';
        okDiv.classList.remove('hidden');
        setTimeout(() => { window.location.href = '/pages/login.html'; }, 1500);
      } catch (err) {
        showError('error', err.message || '重置失败');
        btn.disabled = false; btn.textContent = '重置密码';
      }
    }
  </script>
</body>
</html>
