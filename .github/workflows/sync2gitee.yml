name: Sync to Gitee

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码 (使用 GitHub 默认的 GITHUB_TOKEN)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取全部历史记录

      # 2. 配置 Git 用户信息
      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      # 3. 添加 Gitee 为新的远程仓库，并推送
      - name: Push to Gitee
        env:
          GITEE_SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
        run: |
          # 创建 SSH 目录并设置权限
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # 将私钥写入文件
          echo "$GITEE_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 将 Gitee 添加到 known_hosts，避免首次连接确认
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts
          
          # 添加 Gitee 远程仓库地址
          git remote add gitee git@gitee.com:dxx114514/winoj.mimo.git
          
          # 强制推送到 Gitee 的 main 分支
          git push gitee main
