<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WinOJ API 文档</title>
<meta name="description" content="WinOJ 在线评测系统 API 接口文档。所有接口前缀 /api/v1，响应格式统一为 JSON。">
<style>
  :root {
    --bg: #0b1020;
    --bg-soft: #101730;
    --card: #141c38;
    --card-border: #22305c;
    --text: #e8ecf7;
    --text-dim: #9aa6c8;
    --text-faint: #6b7799;
    --accent: #6366f1;
    --accent-2: #22d3ee;
    --green: #34d399;
    --red: #f87171;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  nav {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(12px);
    background: rgba(11,16,32,.85);
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  nav .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 62px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
  .brand .logo {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; color: #fff; font-size: 15px; font-weight: 800;
  }
  .nav-links { display: flex; gap: 22px; font-size: 13.5px; color: var(--text-dim); align-items: center; }
  .nav-links a { transition: color .2s; }
  .nav-links a:hover { color: var(--text); }
  .nav-toggle { display: none; background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; padding: 0; }
  @media (max-width: 820px) {
    .nav-toggle { display: block; }
    .nav-links { display: none; position: absolute; top: 62px; left: 0; right: 0; flex-direction: column; gap: 0; background: var(--bg-soft); border-bottom: 1px solid var(--card-border); padding: 8px 0; }
    .nav-links.open { display: flex; }
    .nav-links a { display: block; padding: 12px 24px; width: 100%; }
  }

  header { padding: 52px 0 36px; text-align: center; }
  header .crumb { font-size: 13px; color: var(--text-faint); margin-bottom: 12px; }
  header .crumb a { color: var(--accent-2); }
  header .crumb a:hover { text-decoration: underline; }
  header h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; }
  header h1 .grad { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { max-width: 600px; margin: 12px auto 0; color: var(--text-dim); font-size: 14.5px; }
  header .raw-links { margin-top: 18px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; font-size: 13px; }
  header .raw-links a { color: var(--text-dim); border: 1px solid var(--card-border); background: var(--card); padding: 7px 16px; border-radius: 999px; transition: all .2s; }
  header .raw-links a:hover { color: var(--accent-2); border-color: rgba(34,211,238,.4); }

  .layout { max-width: 1200px; margin: 0 auto; padding: 0 24px 80px; display: grid; grid-template-columns: 230px 1fr; gap: 40px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .toc { position: sticky; top: 84px; align-self: start; max-height: calc(100vh - 110px); overflow-y: auto; }
  @media (max-width: 900px) { .toc { display: none; } }
  .toc .toc-title { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: var(--text-faint); text-transform: uppercase; margin-bottom: 14px; }
  .toc a { display: block; font-size: 13px; color: var(--text-dim); padding: 5px 10px; border-radius: 7px; border-left: 2px solid transparent; transition: all .15s; }
  .toc a:hover { color: var(--text); background: rgba(255,255,255,.04); }
  .toc a.on { color: var(--accent-2); border-left-color: var(--accent-2); background: rgba(34,211,238,.06); }
  .toc a.l2 { padding-left: 22px; font-size: 12px; }

  /* ── 深色 Markdown 渲染样式 ─────────── */
  .markdown-body {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 40px 44px;
    min-width: 0;
  }
  @media (max-width: 767px) { .markdown-body { padding: 22px 18px; } }
  .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { color: var(--text); font-weight: 700; line-height: 1.35; scroll-margin-top: 80px; }
  .markdown-body h1 { font-size: 26px; padding-bottom: 14px; border-bottom: 1px solid var(--card-border); margin-bottom: 22px; }
  .markdown-body h2 { font-size: 20px; margin: 34px 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--card-border); }
  .markdown-body h3 { font-size: 16.5px; margin: 26px 0 10px; }
  .markdown-body h4 { font-size: 14.5px; margin: 20px 0 8px; }
  .markdown-body p { font-size: 14.5px; color: var(--text-dim); margin: 12px 0; }
  .markdown-body a { color: var(--accent-2); }
  .markdown-body a:hover { text-decoration: underline; }
  .markdown-body ul, .markdown-body ol { font-size: 14.5px; color: var(--text-dim); margin: 12px 0; padding-left: 24px; }
  .markdown-body li { margin: 5px 0; }
  .markdown-body li::marker { color: var(--accent); }
  .markdown-body strong { color: var(--text); font-weight: 600; }
  .markdown-body code {
    font-family: "Cascadia Code", Consolas, monospace;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.09);
    padding: 1px 7px; border-radius: 6px; font-size: .85em; color: #a5b4fc;
  }
  .markdown-body pre {
    background: #0a0e1d; border: 1px solid var(--card-border); border-radius: 10px;
    padding: 16px 18px; overflow-x: auto; margin: 14px 0;
  }
  .markdown-body pre code { background: none; border: 0; padding: 0; color: #c7d2fe; font-size: 13px; line-height: 1.6; }
  .markdown-body blockquote {
    border-left: 3px solid var(--accent);
    background: rgba(99,102,241,.07);
    padding: 10px 16px; margin: 14px 0; border-radius: 0 10px 10px 0;
  }
  .markdown-body blockquote p { color: var(--text-dim); margin: 4px 0; }
  .markdown-body hr { border: 0; border-top: 1px solid var(--card-border); margin: 26px 0; }
  .markdown-body img { max-width: 100%; border-radius: 8px; }
  .markdown-body table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 13.5px; display: block; overflow-x: auto; }
  .markdown-body th, .markdown-body td { text-align: left; padding: 10px 14px; border: 1px solid var(--card-border); }
  .markdown-body th { background: rgba(99,102,241,.08); color: var(--text); font-weight: 700; white-space: nowrap; }
  .markdown-body td { color: var(--text-dim); }
  .markdown-body tr:nth-child(even) td { background: rgba(255,255,255,.02); }

  .status-msg { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 15px; }
  .error-msg { color: var(--red); font-weight: 600; }
  .error-msg a { color: var(--accent-2); text-decoration: underline; }

  footer { border-top: 1px solid rgba(255,255,255,.06); padding: 32px 0; text-align: center; color: var(--text-faint); font-size: 13px; }
  footer a { color: var(--accent-2); }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="brand" href="index.html"><span class="logo">OJ</span> WinOJ API 文档</a>
    <button class="nav-toggle" aria-label="菜单">☰</button>
    <div class="nav-links">
      <a href="index.html">返回官网</a>
      <a href="../support.html">支持中心</a>
    </div>
  </div>
</nav>

<header>
  <div class="wrap" style="max-width:1200px;margin:0 auto;padding:0 24px;">
    <div class="crumb"><a href="../index.html">WinOJ 官网</a> / <a href="../support.html">支持中心</a> / API 文档</div>
    <h1>WinOJ <span class="grad">API 文档</span></h1>
    <p>所有接口前缀 <code style="background:rgba(255,255,255,.07);padding:1px 7px;border-radius:6px;font-family:Consolas,monospace;font-size:.85em;">/api/v1</code>，响应格式统一为 JSON。由 <code style="background:rgba(255,255,255,.07);padding:1px 7px;border-radius:6px;font-family:Consolas,monospace;font-size:.85em;">APIuse.md</code> 实时渲染。</p>
    <div class="raw-links">
      <a href="APIuse.md" download>下载 Markdown 原文</a>
      <a href="openapi.yaml" download>下载 OpenAPI (openapi.yaml)</a>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="toc">
    <div class="toc-title">目录</div>
    <div id="toc-list"></div>
  </aside>

  <article id="markdown-content" class="markdown-body">
    <div class="status-msg">正在加载 API 文档…</div>
  </article>
</div>

<footer>
  <div class="wrap" style="max-width:1200px;margin:0 auto;padding:0 24px;">
    WinOJ API 文档 · 由 APIuse.md 自动渲染 · 有疑问请 <a href="https://github.com/dxx114514-stack/winoj.mimo/issues" target="_blank" rel="noopener">提交 Issue</a>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function () {
  var toggle = document.querySelector('.nav-toggle');
  var navLinks = document.querySelector('.nav-links');
  toggle.addEventListener('click', function () { navLinks.classList.toggle('open'); });

  var contentDiv = document.getElementById('markdown-content');
  var tocList = document.getElementById('toc-list');

  function buildToc() {
    var anchors = contentDiv.querySelectorAll('h2, h3');
    var html = '';
    var idx = 0;
    anchors.forEach(function (h) {
      var level = h.tagName === 'H2' ? 'l1' : 'l2';
      var id = 'sec-' + idx++;
      h.id = id;
      var text = h.textContent.replace(/\s+/g, ' ').trim();
      html += '<a class="' + level + '" href="#' + id + '" data-anchor="' + id + '">' + text + '</a>';
    });
    tocList.innerHTML = html;

    var links = tocList.querySelectorAll('a');
    if (!('IntersectionObserver' in window)) return;
    var map = {};
    links.forEach(function (a) {
      var id = a.getAttribute('data-anchor');
      var el = document.getElementById(id);
      if (el) map[id] = a;
    });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting && map[e.target.id]) {
          links.forEach(function (a) { a.classList.remove('on'); });
          map[e.target.id].classList.add('on');
        }
      });
    }, { rootMargin: '-10% 0px -80% 0px' });
    Object.keys(map).forEach(function (id) { io.observe(document.getElementById(id)); });
  }

  if (typeof marked === 'undefined') {
    contentDiv.innerHTML = '<div class="status-msg error-msg">Markdown 解析库加载失败（marked.js）。<br><br><a href="APIuse.md" download>点击下载 Markdown 原文</a></div>';
    return;
  }

  marked.setOptions({ breaks: true, gfm: true });

  fetch('APIuse.md')
    .then(function (response) {
      if (!response.ok) throw new Error('找不到 APIuse.md 文件，请检查路径');
      return response.text();
    })
    .then(function (markdownText) {
      contentDiv.innerHTML = marked.parse(markdownText);
      buildToc();
    })
    .catch(function (error) {
      contentDiv.innerHTML =
        '<div class="status-msg error-msg">文档加载失败：' + (error && error.message || error) + '<br><br>' +
        '<a href="APIuse.md" download>点击下载 Markdown 原文</a> | ' +
        '<a href="https://github.com/dxx114514-stack/winoj.mimo/blob/main/docs/api/APIuse.md" target="_blank" rel="noopener">在 GitHub 查看</a></div>';
    });
})();
</script>
</body>
</html>
