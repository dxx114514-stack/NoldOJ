                  description: true=开放访客注册 / false=仅管理员创建
      responses:
        '200':
          description: 切换成功，返回新状态
        '403':
          $ref: '#/components/responses/Forbidden'

  # ===== ACHIEVEMENTS =====
  /achievements:
    get:
      tags: [成就]
      summary: 成就列表
      description: |
        返回全部成就及指定用户的解锁状态。`user_id` 缺省时返回当前登录用户本人的成就。

        隐私：查看他人成就时，若目标用户开启了 `hide_achievements`，则非本人且非 admin/su 的访问返回 403。
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
          description: 指定查看的用户 id（缺省为本人）
      responses:
        '200':
          description: 成就列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: 成就总数
                  unlocked:
                    type: integer
                    description: 已解锁数
                  achievements:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        code:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        icon:
                          type: string
                        unlocked:
                          type: boolean
                        unlocked_at:
                          type: string
                          nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===== STATISTICS =====
  /statistics/me/stats:
    get:
      tags: [统计]
      summary: 个人数据看板
      description: |
        返回提交日历（近 365 天）、语言分布、AC 题目难度分布、概览统计。`user_id` 缺省时返回当前登录用户本人的数据。

        隐私：查看他人看板时，若目标用户开启了 `hide_dashboard`，则非本人且非 admin/su 的访问返回 403。
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
          description: 指定查看的用户 id（缺省为本人）
      responses:
        '200':
          description: 看板数据
          content:
            application/json:
              schema:
                type: object
                properties:
                  overview:
                    type: object
                    properties:
                      totalAccepted:
                        type: integer
                      totalSubmits:
                        type: integer
                      totalProblems:
                        type: integer
                      totalFavorites:
                        type: integer
                      achievements:
                        type: integer
                  calendar:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                        submits:
                          type: integer
                        acs:
                          type: integer
                  languages:
                    type: array
                    items:
                      type: object
                      properties:
                        language:
                          type: string
                        submits:
                          type: integer
                        acs:
                          type: integer
                  difficulty:
                    type: array
                    items:
                      type: object
                      properties:
                        difficulty:
                          type: integer
                        count:
                          type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===== FAVORITES =====
  /favorites:
    get:
      tags: [收藏]
      summary: 收藏列表
      description: |
        返回指定用户的收藏题目列表（分页）。`user_id` 缺省时返回当前登录用户本人的收藏。

        隐私：查看他人收藏时，若目标用户开启了 `hide_favorites`，则非本人且非 admin/su 的访问返回 403。
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
          description: 指定查看的用户 id（缺省为本人）
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        '200':
          description: 收藏列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  page:
                    type: integer
                  size:
                    type: integer
                  favorites:
                    type: array
                    items:
                      type: object
                      properties:
                        problem_id:
                          type: integer
                        title:
                          type: string
                        difficulty:
                          type: integer
                        problem_type:
                          type: string
                        created_at:
                          type: string
                        solved:
                          type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /favorites/status:
    get:
      tags: [收藏]
      summary: 批量检查收藏状态
      description: 查询当前登录用户是否收藏了指定题目（ids=1,2,3，最多 500 个）
      security:
        - bearerAuth: []
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 收藏状态映射
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorites:
                    type: object
                    additionalProperties:
                      type: boolean

  /favorites/{problemId}:
    post:
      tags: [收藏]
      summary: 收藏题目
      security:
        - bearerAuth: []
      parameters:
        - name: problemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 收藏成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorited:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [收藏]
      summary: 取消收藏
      security:
        - bearerAuth: []
      parameters:
        - name: problemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 取消收藏成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorited:
                    type: boolean
                    example: false
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ===== LANGUAGES =====
  /languages:
    get:
      tags: [语言]
      summary: 语言列表
      responses:
        '200':
          description: 语言列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Language'
    post:
      tags: [语言]
      summary: 添加语言
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, display_name, run_cmd, extension]
              properties:
                name:
                  type: string
                display_name:
                  type: string
                compile_cmd:
                  type: string
                run_cmd:
                  type: string
                extension:
                  type: string
      responses:
        '201':
          description: 添加成功

  /languages/{id}:
    put:
      tags: [语言]
      summary: 更新语言
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 更新成功
    delete:
      tags: [语言]
      summary: 删除语言
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  # ===== CONTESTS =====
  /contests:
    get:
      tags: [比赛]
      summary: 比赛列表
      responses:
        '200':
          description: 比赛列表
    post:
      tags: [比赛]
      summary: 创建比赛
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, start_time, end_time]
              properties:
                title:
                  type: string
                description:
                  type: string
                start_time:
                  type: string
                  format: date-time
                end_time:
                  type: string
                  format: date-time
                is_virtual:
                  type: integer
      responses:
        '201':
          description: 创建成功

  /contests/{id}:
    get:
      tags: [比赛]
      summary: 比赛详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 比赛详情
    put:
      tags: [比赛]
      summary: 更新比赛
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 更新成功
    delete:
      tags: [比赛]
      summary: 删除比赛
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  /contests/{id}/problems:
    post:
      tags: [比赛]
      summary: 添加题目到比赛
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [problem_id]
              properties:
                problem_id:
                  type: integer
                alias:
                  type: string
                sort_order:
                  type: integer
                  default: 0
      responses:
        '201':
          description: 添加成功

  /contests/{id}/problems/{pid}:
    delete:
      tags: [比赛]
      summary: 从比赛中移除题目
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: pid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 移除成功

  /contests/{id}/invite:
    post:
      tags: [比赛]
      summary: 邀请用户参赛
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: integer
      responses:
        '200':
          description: 邀请成功

  /contests/{id}/join:
    post:
      tags: [比赛]
      summary: 加入比赛
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 加入成功

  /contests/{id}/participants:
    get:
      tags: [比赛]
      summary: 参赛用户列表
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 参赛用户列表

  /contests/{id}/participants/{uid}:
    delete:
      tags: [比赛]
      summary: 移除参赛用户
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 移除成功

  /contests/{id}/leaderboard:
    get:
      tags: [比赛]
      summary: 比赛排行榜
      description: 可选认证。参赛者/teacher/admin/su 返回完整排行榜（含 rank、total_score、total_time、各题得分）；非参赛者或未登录仅返回冻结状态（leaderboard 为空），不泄露排名。冻结时只统计冻结时刻前的提交。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 排行榜

  /contests/{id}/unfreeze:
    post:
      tags: [比赛]
      summary: 解除排行榜冻结
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 解冻成功

  /contests/{id}/announcements:
    get:
      tags: [比赛]
      summary: 比赛内公告列表
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 公告列表

  /contests/{id}/virtual-start:
    post:
      tags: [比赛]
      summary: 发起虚拟参赛
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 虚拟参赛已启动

  /contests/{id}/plagiarism-check:
    post:
      tags: [比赛]
      summary: 对比赛所有题目一键查重
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                threshold:
                  type: integer
                  default: 80
                min_submissions:
                  type: integer
                  default: 2
      responses:
        '200':
          description: 查重任务已启动

  /contests/{id}/discussions:
    get:
      tags: [比赛]
      summary: 比赛讨论列表
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 讨论列表

  # ===== ARTICLES =====
  /articles:
    get:
      tags: [文章]
      summary: 文章列表
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: 文章列表
    post:
      tags: [文章]
      summary: 发布文章
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                content:
                  type: string
                  description: Markdown 格式
                provider:
                  type: string
                is_published:
                  type: integer
                  enum: [0, 1]
                  default: 0
      responses:
        '201':
          description: 发布成功

  /articles/{id}:
    get:
      tags: [文章]
      summary: 文章详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 文章详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
    put:
      tags: [文章]
      summary: 编辑文章
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 编辑成功
    delete:
      tags: [文章]
      summary: 删除文章
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  # ===== UPLOADS =====
  /uploads:
    get:
      tags: [文件]
      summary: 文件列表
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: 文件列表
    post:
      tags: [文件]
      summary: 上传文件
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: "最大 10MB"
      responses:
        '201':
          description: 上传成功

  /uploads/{filename}:
    get:
      tags: [文件]
      summary: 访问文件
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 文件内容

  /uploads/{id}:
    delete:
      tags: [文件]
      summary: 删除文件
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  # ===== DISCUSSIONS =====
  /discussions:
    post:
      tags: [讨论]
      summary: 创建讨论
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                problem_id:
                  type: integer
                  description: 题目讨论，与 contest_id 二选一
                contest_id:
                  type: integer
                  description: 比赛讨论，与 problem_id 二选一
                title:
                  type: string
                content:
                  type: string
                  description: Markdown 格式
      responses:
        '201':
          description: 创建成功

  /discussions/{id}:
    get:
      tags: [讨论]
      summary: 讨论详情（含楼中楼回复树，最多两层）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 讨论详情
    put:
      tags: [讨论]
      summary: 更新讨论（作者或 admin）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                pinned:
                  type: boolean
                locked:
                  type: boolean
                is_official:
                  type: boolean
      responses:
        '200':
          description: 更新成功
    delete:
      tags: [讨论]
      summary: 删除讨论（作者或 admin，含全部回复）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  /discussions/{id}/replies:
    post:
      tags: [讨论]
      summary: 发表回复
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                parent_id:
                  type: integer
                  description: 二级回复时指向一级回复 id
      responses:
        '201':
          description: 回复成功

  /discussions/{id}/replies/{rid}:
    delete:
      tags: [讨论]
      summary: 删除回复（作者或 admin，级联删除其直接子回复）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: rid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  /discussions/{id}/pin:
    put:
      tags: [讨论]
      summary: 置顶/取消置顶（teacher+）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pinned]
              properties:
                pinned:
                  type: boolean
      responses:
        '200':
          description: 成功

  /discussions/{id}/lock:
    put:
      tags: [讨论]
      summary: 锁定/解锁（teacher+）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locked]
              properties:
                locked:
                  type: boolean
      responses:
        '200':
          description: 成功

  /discussions/{id}/official:
    put:
      tags: [讨论]
      summary: 标记官方题解（teacher+）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_official]
              properties:
                is_official:
                  type: boolean
      responses:
        '200':
          description: 成功

  # ===== STATS =====
  /stats:
    get:
      tags: [统计]
      summary: 首页统计数据
      responses:
        '200':
          description: 统计数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'

  # ===== CATEGORIES =====
  /categories:
    get:
      tags: [分类]
      summary: 分类列表
      responses:
        '200':
          description: 分类列表
    post:
      tags: [分类]
      summary: 创建分类
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: 创建成功

  /categories/{id}:
    get:
      tags: [分类]
      summary: 分类详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 分类详情
    put:
      tags: [分类]
      summary: 更新分类
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: 更新成功
    delete:
      tags: [分类]
      summary: 删除分类
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  /categories/{id}/problems/{pid}:
    post:
      tags: [分类]
      summary: 把题目加入分类
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: pid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 加入成功
    delete:
      tags: [分类]
      summary: 把题目移出分类
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: pid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 移除成功

  # ===== ANNOUNCEMENTS =====
  /announcements:
    get:
      tags: [公告]
      summary: 公告列表
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            default: global
      responses:
        '200':
          description: 公告列表
    post:
      tags: [公告]
      summary: 创建公告
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                content:
                  type: string
                type:
                  type: string
                  default: global
                pinned:
                  type: boolean
                  default: false
      responses:
        '201':
          description: 创建成功

  /announcements/{id}:
    get:
      tags: [公告]
      summary: 公告详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 公告详情
    put:
      tags: [公告]
      summary: 更新公告
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                pinned:
                  type: boolean
      responses:
        '200':
          description: 更新成功
    delete:
      tags: [公告]
      summary: 删除公告
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  # ===== PROBLEM SETS =====
  /problem-sets:
    get:
      tags: [题单]
      summary: 题单列表
      responses:
        '200':
          description: 公开题单列表
    post:
      tags: [题单]
      summary: 创建题单
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                description:
                  type: string
                is_public:
                  type: integer
                  enum: [0, 1]
                  default: 1
                problemIds:
                  type: array
                  items:
                    type: integer
      responses:
        '201':
          description: 创建成功

  /problem-sets/{id}:
    get:
      tags: [题单]
      summary: 题单详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 题单详情
    put:
      tags: [题单]
      summary: 更新题单信息
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                is_public:
                  type: integer
                  enum: [0, 1]
      responses:
        '200':
          description: 更新成功
    delete:
      tags: [题单]
      summary: 删除题单
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  /problem-sets/{id}/problems:
    put:
      tags: [题单]
      summary: 覆盖式设置题单题目列表
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [problemIds]
              properties:
                problemIds:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: 更新成功

  /problem-sets/{id}/progress:
    get:
      tags: [题单]
      summary: 当前用户解题进度
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 解题进度

  /problem-sets/{id}/progress/{pid}:
    post:
      tags: [题单]
      summary: 标记题目已 AC
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: pid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 标记成功

