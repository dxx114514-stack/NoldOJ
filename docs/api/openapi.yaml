openapi: 3.0.3
info:
  title: NoldOJ API
  description: |
    Windows 在线评测系统 API。支持多语言代码评测、安全沙箱执行、自定义计分脚本、比赛管理、文章系统、Rating 机制、AI 代码安全审查等功能。

    ## 认证
    大部分接口需携带 JWT Token：`Authorization: Bearer <access_token>`
    Access Token 有效期 15 分钟，过期后通过 `POST /auth/refresh` 刷新。

    ## 错误响应
    ```json
    { "code": 1|2|3|4|5|6, "reason": "ERR_xxx", "message": "..." }
    ```
    错误码：1=参数错误, 2=状态错误, 3=未找到, 4=限流, 5=未认证, 6=权限不足

    ## 角色层级
    user < teacher < admin < su
  version: 1.6.0
  contact:
    name: NoldOJ
  license:
    name: MIT

servers:
  - url: http://localhost:3000/api/v1
    description: 本地开发

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
          description: "错误码: 1=参数错误, 2=状态错误, 3=未找到, 4=限流, 5=未认证, 6=权限不足"
        reason:
          type: string
        message:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        nickname:
          type: string
        role:
          type: string
          enum: [user, teacher, admin, su]
        rating:
          type: integer
        signature:
          type: string
        bio:
          type: string
        email:
          type: string
        hide_rating:
          type: integer
          enum: [0, 1]
        hide_achievements:
          type: integer
          enum: [0, 1]
          description: 1=成就对其它普通用户隐藏（admin/su 始终可见）
        hide_dashboard:
          type: integer
          enum: [0, 1]
          description: 1=数据看板对其它普通用户隐藏（admin/su 始终可见）
        hide_favorites:
          type: integer
          enum: [0, 1]
          description: 1=收藏对其它普通用户隐藏（admin/su 始终可见）
        preferred_language:
          type: string
        max_file_size:
          type: integer
          description: 单文件大小限制（字节），0=使用系统默认
        max_storage:
          type: integer
          description: 总存储限制（字节），0=使用系统默认
        created_at:
          type: string

    Problem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        input_desc:
          type: string
        output_desc:
          type: string
        hint:
          type: string
        time_limit:
          type: integer
          description: 毫秒
        memory_limit:
          type: integer
          description: MB
        problem_type:
          type: string
          enum: [traditional, interactive, communication, submit_answer]
        compare_mode:
          type: string
          enum: [text_strict, text_relaxed, real_number, spj]
        is_public:
          type: integer
          enum: [0, 1]
        provider:
          type: string
        created_at:
          type: string
        samples:
          type: array
          description: 题面样例点(R12-1, 按 sort_order 排序; 兼容旧单样例字段)
          items:
            type: object
            properties:
              input:
                type: string
              output:
                type: string
              note:
                type: string
                description: 可选说明(≤500 字符)

    Submission:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        problem_id:
          type: integer
        language:
          type: string
        source_code:
          type: string
        status:
          type: string
          enum: [pending, running, compiling, judging, accepted, wrong_answer, time_limit_exceeded, memory_limit_exceeded, runtime_error, compile_error, system_error, pending_rejudge]
        score:
          type: number
        time_used:
          type: integer
          description: 毫秒
        memory_used:
          type: integer
          description: KB
        created_at:
          type: string

    SubmissionDetail:
      type: object
      properties:
        id:
          type: integer
        submission_id:
          type: integer
        test_case_id:
          type: integer
        group_id:
          type: integer
        subtask_id:
          type: string
        status:
          type: string
        score:
          type: number
        time_used:
          type: integer
        memory_used:
          type: integer
        stdout:
          type: string
        stderr:
          type: string
        exit_code:
          type: integer

    TestCase:
      type: object
      properties:
        id:
          type: integer
        input_data:
          type: string
        output_data:
          type: string
        input_file:
          type: string
        output_file:
          type: string
        score:
          type: number
        sort_order:
          type: integer

    TestGroup:
      type: object
      properties:
        id:
          type: integer
        problem_id:
          type: integer
        subtask_id:
          type: string
        score:
          type: number
        aggregator:
          type: string
          enum: [sum, min, max, min_score, max_time, custom]
        dependency:
          type: array
          items:
            type: integer
        scoring_script:
          type: string

    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
        created_at:
          type: string

    Contest:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        start_time:
          type: string
        end_time:
          type: string
        is_virtual:
          type: integer
        created_by:
          type: integer
        created_at:
          type: string

    Article:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        author_id:
          type: integer
        provider:
          type: string
        is_published:
          type: integer
          enum: [0, 1]
        created_at:
          type: string
        updated_at:
          type: string

    Language:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        display_name:
          type: string
        compile_cmd:
          type: string
        run_cmd:
          type: string
        extension:
          type: string
        is_enabled:
          type: integer
          enum: [0, 1]

    UploadedFile:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        filename:
          type: string
        original_name:
          type: string
        mime_type:
          type: string
        size:
          type: integer
        created_at:
          type: string

    Stats:
      type: object
      properties:
        problems:
          type: integer
        submissions:
          type: integer
        users:
          type: integer
        languages:
          type: integer

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
    SearchParam:
      name: search
      in: query
      schema:
        type: string

  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 未找到
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  # ===== AUTH =====
  /auth/captcha:
    get:
      tags: [认证]
      summary: 获取 SVG 图形验证码
      description: 返回验证码 ID 和 SVG 图形，用于登录/注册验证
      responses:
        '200':
          description: 验证码数据
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: 验证码会话 ID
                  svg:
                    type: string
                    description: SVG 图形验证码

  /auth/email-enabled:
    get:
      tags: [认证]
      summary: 查询邮件服务是否启用
      responses:
        '200':
          description: 启用状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean

  /auth/send-code:
    post:
      tags: [认证]
      summary: 发送验证码邮件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        '200':
          description: 验证码已发送

  /auth/verify-code:
    post:
      tags: [认证]
      summary: 邮箱验证码登录/注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: 验证成功

  /auth/login:
    post:
      tags: [认证]
      summary: 登录（需验证码）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, captcha_id, captcha_code]
              properties:
                username:
                  type: string
                password:
                  type: string
                captcha_id:
                  type: string
                  description: 验证码会话 ID
                captcha_code:
                  type: string
                  description: 验证码内容
      responses:
        '200':
          description: 登录成功
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "refresh_token=xxx; HttpOnly; Path=/api/v1/auth"
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/register:
    post:
      tags: [认证]
      summary: 注册（需验证码）
      description: |
        注册新账号。若管理员已关闭自行注册（通过 `PUT /users/register-enabled`），则返回 403 `ERR_REGISTER_DISABLED`。
        超管可通过 `POST /users` 直接创建账号，不受此开关限制。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, captcha_id, captcha_code]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 32
                password:
                  type: string
                  minLength: 6
                nickname:
                  type: string
                email:
                  type: string
                email_code:
                  type: string
                captcha_id:
                  type: string
                  description: 验证码会话 ID
                captcha_code:
                  type: string
                  description: 验证码内容
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'

  /auth/refresh:
    post:
      tags: [认证]
      summary: 刷新 Token
      description: 需携带 HttpOnly Cookie 中的 refresh_token
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/logout:
    post:
      tags: [认证]
      summary: 退出登录
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 退出成功

  /auth/change-password:
    post:
      tags: [认证]
      summary: 修改密码
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: 修改成功

  # ===== PROBLEMS =====
  /problems:
    get:
      tags: [题目]
      summary: 题目列表
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: tag
          in: query
          schema:
            type: string
          description: 按标签筛选
      responses:
        '200':
          description: 题目列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  problems:
                    type: array
                    items:
                      $ref: '#/components/schemas/Problem'
    post:
      tags: [题目]
      summary: 创建题目
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                description:
                  type: string
                input_desc:
                  type: string
                output_desc:
                  type: string
                hint:
                  type: string
                time_limit:
                  type: integer
                  default: 1000
                memory_limit:
                  type: integer
                  default: 256
                problem_type:
                  type: string
                  enum: [traditional, interactive, communication, submit_answer]
                  default: traditional
                compare_mode:
                  type: string
                  enum: [text_strict, text_relaxed, real_number, spj]
                  default: text_strict
                real_number_tolerance:
                  type: object
                  properties:
                    absolute:
                      type: number
                      default: 0.001
                    relative:
                      type: number
                      default: 0.001
                spj_code:
                  type: string
                allowed_languages:
                  type: array
                  items:
                    type: string
                is_public:
                  type: boolean
                  default: true
                provider:
                  type: string
      responses:
        '201':
          description: 创建成功

  /problems/{id}:
    get:
      tags: [题目]
      summary: 题目详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 题目详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [题目]
      summary: 更新题目
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 更新成功
    delete:
      tags: [题目]
      summary: 删除题目
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  /problems/{id}/testcases:
    get:
      tags: [题目]
      summary: 查看测试点列表
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 测试点列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestCase'
    post:
      tags: [题目]
      summary: 批量添加测试点
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [test_cases]
              properties:
                test_cases:
                  type: array
                  items:
                    type: object
                    properties:
                      input_data:
                        type: string
                      output_data:
                        type: string
                      score:
                        type: number
      responses:
        '200':
          description: 添加成功
    delete:
      tags: [题目]
      summary: 删除所有测试点
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  /problems/{id}/testcases/{tcid}:
    put:
      tags: [题目]
      summary: 更新测试点
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: tcid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 更新成功
    delete:
      tags: [题目]
      summary: 删除单个测试点
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: tcid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  /problems/{id}/testdata:
    get:
      tags: [题目]
      summary: 查看测试点列表
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 测试点列表
    post:
      tags: [题目]
      summary: 上传测试数据文件
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: "文件命名 name.in / name.out"
      responses:
        '200':
          description: 上传成功

  /problems/{id}/testdata-zip:
    post:
      tags: [题目]
      summary: 上传 ZIP 测试数据
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: ".zip 文件"
      responses:
        '200':
          description: 导入成功

  /problems/{id}/groups:
    get:
      tags: [题目]
      summary: 获取测试分组列表
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 分组列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestGroup'
    post:
      tags: [题目]
      summary: 创建测试分组
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subtask_id]
              properties:
                subtask_id:
                  type: string
                score:
                  type: number
                aggregator:
                  type: string
                  enum: [sum, min, max, min_score, max_time, custom]
                  default: sum
                dependency:
                  type: array
                  items:
                    type: integer
                scoring_script:
                  type: string
      responses:
        '201':
          description: 创建成功

  /problems/{id}/groups/{gid}:
    put:
      tags: [题目]
      summary: 更新测试分组
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: gid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 更新成功
    delete:
      tags: [题目]
      summary: 删除测试分组
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: gid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除成功

  /problems/{id}/scoring-script:
    put:
      tags: [题目]
      summary: 设置题目级计分脚本
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scoring_script:
                  type: string
      responses:
        '200':
          description: 更新成功

  /problems/{id}/testcases/{tcid}/group:
    put:
      tags: [题目]
      summary: 设置测试点所属分组
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: tcid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                group_id:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: 更新成功

  /problems/{id}/solutions:
    get:
      tags: [题目]
      summary: 获取题目题解列表
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
